<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Flow & Global Data Architecture Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js for 3D WebGL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- KaTeX for Beautiful Math/Physics Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
        }

        .panel {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-right: 1px solid #334155;
        }

        .tab-btn {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .tab-btn.active {
            border-left-color: #06b6d4;
            background: rgba(6, 182, 212, 0.1);
            color: #22d3ee;
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }

        .katex-display {
            margin: 0.5em 0 !important;
        }

        /* Custom Scrollbar for panel */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Dynamic UI Container Overlay */
        #dynamic-ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 20;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #475569;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .action-btn.active {
            background: rgba(6, 182, 212, 0.2);
            border-color: #06b6d4;
            color: #22d3ee;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .action-btn:hover {
            background: rgba(51, 65, 85, 0.9);
        }
    </style>
</head>

<body>

    <!-- WebGL Canvas -->
    <div id="webgl-container"></div>

    <!-- Interactive Layer UI Container (Bottom Center) -->
    <div id="dynamic-ui-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Sidebar Navigation & Context -->
        <div class="panel w-96 h-full flex flex-col shadow-2xl flex-shrink-0">
            <div class="p-6 border-b border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-white mb-2">Parallel Flow Architecture</h1>
                <p class="text-xs text-slate-400">Visualizing concurrent execution, global memory vulnerabilities, and
                    data race hazards.</p>
            </div>

            <!-- Tabs -->
            <div class="flex-1 overflow-y-auto">
                <button
                    class="tab-btn active w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(0)">
                    1. The Software Layer
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(1)">
                    2. Memory Topology (RAM)
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(2)">
                    3. CPU & Registers Layer
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(3)">
                    4. GPU / VRAM Layer
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(4)">
                    5. Under-the-Hood Corrector
                </button>

                <!-- Dynamic Context Area -->
                <div class="p-6 mt-4">
                    <h2 id="context-title" class="text-lg font-bold text-cyan-400 mb-3">The Software Layer</h2>
                    <div id="context-desc" class="text-sm text-slate-300 leading-relaxed space-y-4">
                        <!-- Content injected via JS -->
                    </div>
                    <div id="math-container" class="mt-4 p-4 bg-slate-900 rounded border border-slate-700 hidden">
                        <!-- KaTeX injected here -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. CORE SYSTEM & MEMORY MANAGEMENT
        // ==========================================
        let scene, camera, renderer, animationId;
        let activeLayerGroup = new THREE.Group();
        let clock = new THREE.Clock();
        let currentLayerIndex = 0;

        // Data for dynamic UI updates
        const layerData = [
            {
                title: "The Software Layer",
                desc: "<p><strong>Core Concept:</strong> A central 'Global Data' sphere is simultaneously exposed to multiple logic modules (Withdraw, Deposit, CheckBalance).</p><p>Use the controls below to trigger functions concurrently. Notice how signal waves travel and physically strike the central data node without hitting any encapsulation barriers, mutating its state chaotically.</p>",
                math: ""
            },
            {
                title: "Memory Topology (RAM)",
                desc: "<p>Visualizing physical system memory layout. The <strong>Data Segment (BSS)</strong> holding the global variable is entirely physically separated from the execution <strong>Stack Frames</strong>.</p><p>Watch as multiple distinct execution contexts bypass their local scope boundaries, sending overlapping read/write signals directly to the exact same fixed physical memory address in the data segment.</p>",
                math: ""
            },
            {
                title: "CPU Pipeline & Data Races",
                desc: "<p>The hardware hazard of concurrency. The CPU pipeline attempts to execute instructions from multiple threads simultaneously.</p><p>Watch Thread A and Thread B fetch the same initial value. Both compute, and then both fire Memory Write signals. The non-atomic overlap causes state corruption, visually destroying the valid state at the address.</p>",
                math: "\\text{Reg}_A \\leftarrow [Addr] \\\\ \\text{Reg}_B \\leftarrow [Addr] \\\\ [Addr] \\leftarrow \\text{Reg}_A - 50 \\\\ [Addr] \\leftarrow \\text{Reg}_B + 100 \\\\ \\textbf{Collision Hazard!}"
            },
            {
                title: "GPU / VRAM Rasterization",
                desc: "<p>Visualizing the complex UI rasterization pipeline. The central geometry is pushed to Video RAM via Vertex Buffers.</p><p>When multiple signals contact the geometry concurrently, dynamic particle systems are evaluated by Fragment Shaders to calculate localized surface highlight intensities and color blending in real-time.</p>",
                math: "\\text{Intensity} = \\sum_{i=0}^{n} \\max(0, 1 - \\|\\vec{p} - \\vec{w}_i\\|)"
            },
            {
                title: "Under-the-Hood Corrector",
                desc: "<p><strong>Misconception Corrected:</strong> It's assumed that 'Global' simply means 'Accessible everywhere', but it structurally means 'Vulnerable from everywhere'.</p><p><strong>Reality:</strong> Global Data fundamentally lacks implicit protection. Compare the naked global core (left) absorbing raw asynchronous corruption, to the encapsulated object (right) deflecting unauthorized direct memory writes.</p>",
                math: "\\text{Global} \\equiv \\text{Unsynchronized Shared State}"
            }
        ];

        function initWebGL() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 45);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting setup for high fidelity
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x22d3ee, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const spotLight = new THREE.SpotLight(0xa855f7, 1);
            spotLight.position.set(-15, 10, -15);
            scene.add(spotLight);

            scene.add(activeLayerGroup);

            window.addEventListener('resize', onWindowResize);

            // Initial boot
            switchTab(0);
            animate();
        }

        // Strict WebGL memory and DOM disposal to prevent leaks
        function clearActiveLayer() {
            // Clear DOM UI specific to layers
            document.getElementById('dynamic-ui-container').innerHTML = '';

            // Clear Three.js meshes
            while (activeLayerGroup.children.length > 0) {
                const obj = activeLayerGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
                if (obj.texture) obj.texture.dispose();
                activeLayerGroup.remove(obj);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createTextTexture(text, bgColor, textColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = textColor;
            ctx.font = 'bold 40px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 2. LAYER BUILDERS & ANIMATION LOGIC
        // ==========================================

        let layerState = {};

        // -- Layer 1: Software Layer (Parallel Flow) --
        function buildSoftwareLayer() {
            clearActiveLayer();
            layerState = { globalSphere: null, signals: [], activeFuncs: { w: false, d: false, c: false } };
            camera.position.set(10, 20, 35);
            camera.lookAt(0, 0, 0);

            // Global Data Sphere (Central)
            const sphereGeo = new THREE.SphereGeometry(4, 32, 32);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0x0ea5e9,
                emissive: 0x0284c7,
                emissiveIntensity: 0.3,
                roughness: 0.2,
                metalness: 0.8
            });
            layerState.globalSphere = new THREE.Mesh(sphereGeo, sphereMat);
            activeLayerGroup.add(layerState.globalSphere);

            // Function Blocks (Withdraw, Deposit, CheckBalance)
            const functions = [
                { id: 'w', label: "Withdraw", pos: new THREE.Vector3(-15, 0, 0), color: '#ef4444' },
                { id: 'd', label: "Deposit", pos: new THREE.Vector3(15, 0, 0), color: '#10b981' },
                { id: 'c', label: "CheckBal", pos: new THREE.Vector3(0, 0, -15), color: '#f59e0b' }
            ];

            layerState.emitters = {};

            functions.forEach(f => {
                const tex = createTextTexture(f.label, '#1e293b', f.color);
                const geo = new THREE.BoxGeometry(6, 2, 2);
                const mat = new THREE.MeshStandardMaterial({ map: tex });
                const block = new THREE.Mesh(geo, mat);
                block.position.copy(f.pos);
                block.lookAt(0, 0, 0);
                activeLayerGroup.add(block);
                layerState.emitters[f.id] = f.pos;
            });

            // Build dynamic UI controls
            const uiContainer = document.getElementById('dynamic-ui-container');

            const createBtn = (id, label) => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = `Toggle ${label}`;
                btn.onclick = () => {
                    layerState.activeFuncs[id] = !layerState.activeFuncs[id];
                    btn.classList.toggle('active');
                };
                uiContainer.appendChild(btn);
            };

            createBtn('w', 'Withdraw');
            createBtn('d', 'Deposit');
            createBtn('c', 'CheckBalance');
        }

        function animateSoftwareLayer(time) {
            // Sphere idle pulse
            const pulse = (Math.sin(time * 2) + 1) * 0.2;
            layerState.globalSphere.material.emissiveIntensity = 0.2 + pulse;

            // Emit signals
            if (Math.random() > 0.9) {
                Object.keys(layerState.activeFuncs).forEach(key => {
                    if (layerState.activeFuncs[key]) {
                        const sigGeo = new THREE.SphereGeometry(0.4, 8, 8);
                        const sigMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                        const signal = new THREE.Mesh(sigGeo, sigMat);
                        signal.position.copy(layerState.emitters[key]);
                        activeLayerGroup.add(signal);

                        layerState.signals.push({
                            mesh: signal,
                            start: layerState.emitters[key].clone(),
                            progress: 0
                        });
                    }
                });
            }

            // Move signals and handle collisions
            for (let i = layerState.signals.length - 1; i >= 0; i--) {
                const sig = layerState.signals[i];
                sig.progress += 0.02; // Speed

                sig.mesh.position.lerpVectors(sig.start, new THREE.Vector3(0, 0, 0), sig.progress);

                // Collision with central sphere (radius 4)
                if (sig.mesh.position.length() < 4.2) {
                    // Flash central sphere
                    layerState.globalSphere.material.emissive.setHex(0xffffff);
                    setTimeout(() => {
                        if (layerState.globalSphere) layerState.globalSphere.material.emissive.setHex(0x0284c7);
                    }, 100);

                    // Destroy signal
                    activeLayerGroup.remove(sig.mesh);
                    sig.mesh.geometry.dispose();
                    sig.mesh.material.dispose();
                    layerState.signals.splice(i, 1);
                }
            }
        }

        // -- Layer 2: Memory Topology (RAM) Layer --
        function buildRAMLayer() {
            clearActiveLayer();
            layerState = { signals: [] };
            camera.position.set(0, 25, 20);
            camera.lookAt(0, 0, 0);

            // Data Segment (BSS) - The unprotected Global Area
            const dataSegGeo = new THREE.BoxGeometry(10, 1, 8);
            const dataSegMat = new THREE.MeshStandardMaterial({ color: 0x334155, transparent: true, opacity: 0.8 });
            const dataSeg = new THREE.Mesh(dataSegGeo, dataSegMat);
            dataSeg.position.set(0, 0, -8);
            activeLayerGroup.add(dataSeg);

            // Specific Global Memory Address Block
            const addressGeo = new THREE.BoxGeometry(2, 1.2, 2);
            const addressMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0891b2 });
            const addressBlock = new THREE.Mesh(addressGeo, addressMat);
            addressBlock.position.set(0, 0.1, -8);
            activeLayerGroup.add(addressBlock);

            // Stack Frames (Execution Contexts)
            const stackFrames = [
                { pos: new THREE.Vector3(-8, 0, 8), color: 0xef4444, label: "Stack: Withdraw" },
                { pos: new THREE.Vector3(8, 0, 8), color: 0x10b981, label: "Stack: Deposit" }
            ];

            layerState.stacks = stackFrames;

            stackFrames.forEach(frame => {
                const sGeo = new THREE.CylinderGeometry(3, 3, 4, 32);
                const sMat = new THREE.MeshStandardMaterial({ color: frame.color, wireframe: true });
                const stackMesh = new THREE.Mesh(sGeo, sMat);
                stackMesh.position.copy(frame.pos);
                activeLayerGroup.add(stackMesh);

                // Connector lines visualizing the bypassing of local scope
                const lineMat = new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.5, gapSize: 0.5 });
                const points = [frame.pos, new THREE.Vector3(0, 0, -8)];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeo, lineMat);
                line.computeLineDistances();
                activeLayerGroup.add(line);
            });
        }

        function animateRAMLayer(time) {
            // Emitting packets from Stacks directly to Global Data Segment
            if (Math.random() > 0.92) {
                const stack = layerState.stacks[Math.floor(Math.random() * layerState.stacks.length)];

                const pktGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const pktMat = new THREE.MeshBasicMaterial({ color: stack.color });
                const packet = new THREE.Mesh(pktGeo, pktMat);
                packet.position.copy(stack.pos);
                activeLayerGroup.add(packet);

                layerState.signals.push({ mesh: packet, start: stack.pos.clone(), target: new THREE.Vector3(0, 0, -8), progress: 0 });
            }

            for (let i = layerState.signals.length - 1; i >= 0; i--) {
                const sig = layerState.signals[i];
                sig.progress += 0.015;

                // Arching trajectory to show bypassing scope
                sig.mesh.position.lerpVectors(sig.start, sig.target, sig.progress);
                sig.mesh.position.y += Math.sin(sig.progress * Math.PI) * 4; // Arch effect

                if (sig.progress >= 1) {
                    activeLayerGroup.remove(sig.mesh);
                    sig.mesh.geometry.dispose();
                    sig.mesh.material.dispose();
                    layerState.signals.splice(i, 1);
                }
            }
        }

        // -- Layer 3: CPU & Registers (Data Races) --
        function buildCPULayer() {
            clearActiveLayer();
            layerState = { step: 0, lastTime: 0, state: "IDLE", entities: {} };
            camera.position.set(0, 10, 35);
            camera.lookAt(0, 0, 0);

            // Memory Block
            const memGeo = new THREE.BoxGeometry(6, 4, 2);
            const memMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const mem = new THREE.Mesh(memGeo, memMat);
            mem.position.set(0, 8, 0);
            activeLayerGroup.add(mem);
            layerState.entities.mem = mem;

            // Core A
            const coreAGeo = new THREE.BoxGeometry(4, 4, 4);
            const coreAMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c }); // Red
            const coreA = new THREE.Mesh(coreAGeo, coreAMat);
            coreA.position.set(-8, -4, 0);
            activeLayerGroup.add(coreA);

            // Core B
            const coreBMat = new THREE.MeshStandardMaterial({ color: 0x047857 }); // Green
            const coreB = new THREE.Mesh(coreAGeo, coreBMat);
            coreB.position.set(8, -4, 0);
            activeLayerGroup.add(coreB);

            // Buses
            const busMat = new THREE.LineBasicMaterial({ color: 0xfacc15 });
            activeLayerGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-8, -2, 0), new THREE.Vector3(0, 6, 0)]), busMat));
            activeLayerGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(8, -2, 0), new THREE.Vector3(0, 6, 0)]), busMat));

            // Collision Marker
            const colGeo = new THREE.SphereGeometry(3, 16, 16);
            const colMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0 });
            layerState.entities.explosion = new THREE.Mesh(colGeo, colMat);
            layerState.entities.explosion.position.set(0, 8, 0);
            activeLayerGroup.add(layerState.entities.explosion);

            // Packets
            layerState.entities.pktA = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshBasicMaterial({ color: 0xb91c1c, transparent: true, opacity: 0 }));
            layerState.entities.pktB = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshBasicMaterial({ color: 0x047857, transparent: true, opacity: 0 }));
            activeLayerGroup.add(layerState.entities.pktA);
            activeLayerGroup.add(layerState.entities.pktB);
        }

        function animateCPULayer(time) {
            // State Machine for Data Race Animation
            const cycleDuration = 4.0;
            const t = time % cycleDuration;

            const pA = layerState.entities.pktA;
            const pB = layerState.entities.pktB;
            const expl = layerState.entities.explosion;
            const mem = layerState.entities.mem;

            if (t < 1.0) {
                // Phase 1: Both Read simultaneously
                pA.material.opacity = 1; pB.material.opacity = 1;
                expl.material.opacity = 0;
                mem.material.color.setHex(0x475569);

                pA.position.lerpVectors(new THREE.Vector3(0, 6, 0), new THREE.Vector3(-8, -2, 0), t);
                pB.position.lerpVectors(new THREE.Vector3(0, 6, 0), new THREE.Vector3(8, -2, 0), t);
            } else if (t < 2.0) {
                // Phase 2: Compute locally (hidden packets)
                pA.material.opacity = 0; pB.material.opacity = 0;
            } else if (t < 3.0) {
                // Phase 3: Both Write simultaneously
                const writeProg = t - 2.0;
                pA.material.opacity = 1; pB.material.opacity = 1;
                pA.position.lerpVectors(new THREE.Vector3(-8, -2, 0), new THREE.Vector3(0, 6, 0), writeProg);
                pB.position.lerpVectors(new THREE.Vector3(8, -2, 0), new THREE.Vector3(0, 6, 0), writeProg);
            } else {
                // Phase 4: Collision / Race Condition
                pA.material.opacity = 0; pB.material.opacity = 0;
                expl.material.opacity = 1 - ((t - 3.0) * 2); // Fade out explosion
                mem.material.color.setHex(0xff0000); // Corrupted Memory State
                expl.scale.setScalar(1 + (t - 3.0) * 2);
            }
        }

        // -- Layer 4: GPU / VRAM Layer --
        function buildGPULayer() {
            clearActiveLayer();
            layerState = { geometry: null, waves: [] };
            camera.position.set(0, 15, 20);
            camera.lookAt(0, 0, 0);

            // Wireframe Raster Target
            const geo = new THREE.IcosahedronGeometry(5, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.4 });
            layerState.geometry = new THREE.Mesh(geo, mat);
            activeLayerGroup.add(layerState.geometry);

            // Fragments representation (small point cloud)
            const ptsGeo = new THREE.BufferGeometry();
            const positions = geo.attributes.position.array;
            ptsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const ptsMat = new THREE.PointsMaterial({ color: 0x0284c7, size: 0.2 });
            layerState.points = new THREE.Points(ptsGeo, ptsMat);
            activeLayerGroup.add(layerState.points);
        }

        function animateGPULayer(time) {
            layerState.geometry.rotation.y += 0.005;
            layerState.points.rotation.y += 0.005;

            // Generate waves striking geometry
            if (Math.random() > 0.9) {
                const angle = Math.random() * Math.PI * 2;
                layerState.waves.push({
                    pos: new THREE.Vector3(Math.cos(angle) * 15, 0, Math.sin(angle) * 15),
                    radius: 0
                });
            }

            // Animate waves and simulate fragment shader intensity
            for (let i = layerState.waves.length - 1; i >= 0; i--) {
                let wave = layerState.waves[i];
                wave.pos.lerp(new THREE.Vector3(0, 0, 0), 0.05);

                // Color pulse simulation on the points material based on proximity
                if (wave.pos.length() < 6) {
                    layerState.points.material.color.setHex(0xffffff);
                    setTimeout(() => { if (layerState.points) layerState.points.material.color.setHex(0x0284c7); }, 50);
                    layerState.waves.splice(i, 1);
                }
            }
        }

        // -- Layer 5: Under-the-Hood Corrector --
        function buildCorrectorLayer() {
            clearActiveLayer();
            layerState = { nakedCore: null, protectedCore: null, attackers: [] };
            camera.position.set(0, 5, 30);
            camera.lookAt(0, 0, 0);

            // 1. Naked Global Data (Vulnerable)
            const nakedGeo = new THREE.SphereGeometry(3, 16, 16);
            const nakedMat = new THREE.MeshStandardMaterial({ color: 0xff0000, wireframe: true });
            layerState.nakedCore = new THREE.Mesh(nakedGeo, nakedMat);
            layerState.nakedCore.position.set(-8, 0, 0);
            activeLayerGroup.add(layerState.nakedCore);

            // 2. Encapsulated Data (Protected Object)
            const protCoreMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
            layerState.protectedCore = new THREE.Mesh(nakedGeo, protCoreMat);
            layerState.protectedCore.position.set(8, 0, 0);
            activeLayerGroup.add(layerState.protectedCore);

            // Protection Shell (Mutex / Encapsulation boundary)
            const shellGeo = new THREE.SphereGeometry(4, 32, 32);
            const shellMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
            const shell = new THREE.Mesh(shellGeo, shellMat);
            shell.position.set(8, 0, 0);
            activeLayerGroup.add(shell);
        }

        function animateCorrectorLayer(time) {
            // Fire asynchronous memory writes
            if (Math.random() > 0.8) {
                const isAttackingLeft = Math.random() > 0.5;
                const startPos = new THREE.Vector3((isAttackingLeft ? -8 : 8) + (Math.random() - 0.5) * 15, 10, (Math.random() - 0.5) * 15);
                const targetPos = new THREE.Vector3(isAttackingLeft ? -8 : 8, 0, 0);

                const atkGeo = new THREE.CylinderGeometry(0.1, 0.1, 2);
                const atkMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
                const atk = new THREE.Mesh(atkGeo, atkMat);
                atk.position.copy(startPos);
                atk.lookAt(targetPos);
                atk.rotateX(Math.PI / 2);

                activeLayerGroup.add(atk);
                layerState.attackers.push({ mesh: atk, start: startPos, target: targetPos, progress: 0, isLeft: isAttackingLeft });
            }

            for (let i = layerState.attackers.length - 1; i >= 0; i--) {
                let a = layerState.attackers[i];
                a.progress += 0.05;
                a.mesh.position.lerpVectors(a.start, a.target, a.progress);

                const dist = a.mesh.position.distanceTo(a.target);

                // Naked core receives direct hit (corruption)
                if (a.isLeft && dist < 3.2) {
                    layerState.nakedCore.material.color.setHex(0xffffff);
                    layerState.nakedCore.scale.setScalar(Math.random() * 0.5 + 0.8); // Erratic sizing
                    setTimeout(() => { if (layerState.nakedCore) layerState.nakedCore.material.color.setHex(0xff0000); }, 50);

                    activeLayerGroup.remove(a.mesh);
                    a.mesh.geometry.dispose();
                    a.mesh.material.dispose();
                    layerState.attackers.splice(i, 1);
                }
                // Protected core deflects at the shell boundary (radius 4)
                else if (!a.isLeft && dist < 4.2) {
                    // Bounce effect logic (simply destroy visual here to simulate shield block)
                    activeLayerGroup.remove(a.mesh);
                    a.mesh.geometry.dispose();
                    a.mesh.material.dispose();
                    layerState.attackers.splice(i, 1);
                }
            }

            // Re-stabilize naked core scale
            if (layerState.nakedCore) {
                layerState.nakedCore.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }
        }

        // ==========================================
        // 3. RENDER LOOP & TAB SWITCHING
        // ==========================================

        function animate() {
            animationId = requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Layer-specific logic
            switch (currentLayerIndex) {
                case 0: animateSoftwareLayer(time); break;
                case 1: animateRAMLayer(time); break;
                case 2: animateCPULayer(time); break;
                case 3: animateGPULayer(time); break;
                case 4: animateCorrectorLayer(time); break;
            }

            // General idle rotation
            if (currentLayerIndex !== 0 && currentLayerIndex !== 2) {
                activeLayerGroup.rotation.y = Math.sin(time * 0.3) * 0.1;
            } else {
                activeLayerGroup.rotation.y = 0;
            }

            renderer.render(scene, camera);
        }

        window.switchTab = function (index) {
            currentLayerIndex = index;
            clock.start();

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            switch (index) {
                case 0: buildSoftwareLayer(); break;
                case 1: buildRAMLayer(); break;
                case 2: buildCPULayer(); break;
                case 3: buildGPULayer(); break;
                case 4: buildCorrectorLayer(); break;
            }

            updateUI(index);
        }

        function updateUI(index) {
            const data = layerData[index];
            document.getElementById('context-title').innerText = data.title;
            document.getElementById('context-desc').innerHTML = data.desc;

            const mathContainer = document.getElementById('math-container');
            if (data.math) {
                mathContainer.classList.remove('hidden');
                katex.render(data.math, mathContainer, {
                    throwOnError: false,
                    displayMode: true
                });
            } else {
                mathContainer.classList.add('hidden');
            }
        }

        // Bootstrap the application
        initWebGL();

    </script>
</body>
