<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Execution Architecture Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js for 3D WebGL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- KaTeX for Beautiful Math/Physics Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
        }

        .panel {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-right: 1px solid #334155;
        }

        .tab-btn {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .tab-btn.active {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }

        .katex-display {
            margin: 0.5em 0 !important;
        }

        /* Custom Scrollbar for panel */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

<body>

    <!-- WebGL Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Sidebar Navigation & Context -->
        <div class="panel w-96 h-full flex flex-col shadow-2xl flex-shrink-0">
            <div class="p-6 border-b border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-white mb-2">Procedural Architecture</h1>
                <p class="text-xs text-slate-400">Visualizing the hardware-to-software execution pipeline. Execution
                    order governs data.</p>
            </div>

            <!-- Tabs -->
            <div class="flex-1 overflow-y-auto">
                <button
                    class="tab-btn active w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(0)">
                    1. The Software Layer
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(1)">
                    2. Memory Topology (RAM)
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(2)">
                    3. CPU & Registers
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(3)">
                    4. GPU / VRAM Raster
                </button>
                <button
                    class="tab-btn w-full text-left px-6 py-4 text-sm font-semibold uppercase tracking-wide border-b border-slate-800"
                    onclick="switchTab(4)">
                    5. Under-the-Hood Corrector
                </button>

                <!-- Dynamic Context Area -->
                <div class="p-6 mt-4">
                    <h2 id="context-title" class="text-lg font-bold text-blue-400 mb-3">The Software Layer</h2>
                    <div id="context-desc" class="text-sm text-slate-300 leading-relaxed space-y-4">
                        <!-- Content injected via JS -->
                    </div>
                    <div id="math-container" class="mt-4 p-4 bg-slate-900 rounded border border-slate-700 hidden">
                        <!-- KaTeX injected here -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. CORE SYSTEM & MEMORY MANAGEMENT
        // ==========================================
        let scene, camera, renderer, animationId;
        let activeLayerGroup = new THREE.Group();
        let clock = new THREE.Clock();
        let currentLayerIndex = 0;

        // Data for dynamic UI updates
        const layerData = [
            {
                title: "The Software Layer",
                desc: "<p><strong>Core Concept:</strong> Instruction blocks (Calculate, Print, Save) execute sequentially. Execution order is the primary organizational principle.</p><p>Notice the pointer moving linearly down the track, illuminating the active instruction block and accumulating progress. Data is merely processed along this unyielding path.</p>",
                math: ""
            },
            {
                title: "Memory Topology (RAM)",
                desc: "<p>Visualizing the deterministic, static structure of procedural allocation. The <strong>Stack Frame</strong> grows and shrinks rigidly based on the pointer's location.</p><p>Data (primitives) are pushed sequentially into local activation records and exist only transiently. No dynamic allocation occurs here; it is pure sequential memory tracking.</p>",
                math: ""
            },
            {
                title: "CPU & Registers Pipeline",
                desc: "<p>The hardware instruction pipeline fetching and executing. The Program Counter (PC) steps sequentially, loading binaries into the Instruction Register (IR).</p><p>The Execution Unit fires timing signals to process the logic, proving the rigid physical progression driving the software layer.</p>",
                math: "PC \\leftarrow PC + \\text{offset} \\\\ \\text{Address} = \\text{Base} + \\text{Offset}"
            },
            {
                title: "GPU / VRAM Layer",
                desc: "<p>Watch the UI itself being rasterized. Structural layout data packages into Vertex Buffers, streams to VRAM textures, processes via Shader Cores, and writes to the Frame Buffer.</p><p>The progress bar's illumination intensity directly correlates with GPU fragment shaders processing in real-time.</p>",
                math: "FragColor = \\vec{v}\\_{color} \\cdot \\text{intensity}"
            },
            {
                title: "Under-the-Hood Corrector",
                desc: "<p><strong>Misconception Corrected:</strong> Object-Oriented paradigms often imply data 'owns' behavior. Procedural architecture proves the opposite.</p><p><strong>Reality:</strong> Execution sequence (PC) is the absolute monarch. Data is completely passive, resting in addresses without encapsulation, merely waiting for the instruction pipeline to act upon it.</p>",
                math: "\\text{Logic} \\gg \\text{Data}"
            }
        ];

        function initWebGL() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 30);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x3b82f6, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const spotLight = new THREE.SpotLight(0xffffff, 0.5);
            spotLight.position.set(-10, 20, -10);
            scene.add(spotLight);

            scene.add(activeLayerGroup);

            window.addEventListener('resize', onWindowResize);

            // Load initial layer
            buildSoftwareLayer();
            updateUI(0);
            animate();
        }

        // Strict WebGL memory disposal to prevent leaks
        function clearActiveLayer() {
            while (activeLayerGroup.children.length > 0) {
                const obj = activeLayerGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
                if (obj.texture) obj.texture.dispose();
                activeLayerGroup.remove(obj);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Utility: Generate Text Texture via Canvas API
        function createTextTexture(text, bgColor, textColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = textColor;
            ctx.font = 'bold 40px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // ==========================================
        // 2. LAYER BUILDERS & ANIMATION LOGIC
        // ==========================================

        let layerState = {}; // Holds dynamic references for the render loop

        // -- Layer 1: Software --
        function buildSoftwareLayer() {
            clearActiveLayer();
            layerState = { blocks: [], arrow: null, progressBar: null, progressFill: null };
            camera.position.set(15, 5, 25);
            camera.lookAt(0, 0, 0);

            const steps = ["Step 1: Calculate", "Step 2: Print", "Step 3: Save"];

            // Code Blocks
            for (let i = 0; i < 3; i++) {
                const tex = createTextTexture(steps[i], '#1e293b', '#60a5fa');
                const geo = new THREE.BoxGeometry(10, 2, 2);
                const mat = new THREE.MeshStandardMaterial({ map: tex, color: 0x888888 });
                const block = new THREE.Mesh(geo, mat);
                block.position.set(0, 6 - (i * 4), 0);
                activeLayerGroup.add(block);
                layerState.blocks.push(block);
            }

            // Pointer Arrow
            const arrowGeo = new THREE.ConeGeometry(1, 2, 16);
            const arrowMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.5 });
            layerState.arrow = new THREE.Mesh(arrowGeo, arrowMat);
            layerState.arrow.rotation.z = -Math.PI / 2;
            layerState.arrow.position.set(-8, 6, 0);
            activeLayerGroup.add(layerState.arrow);

            // Progress Track
            const trackGeo = new THREE.BoxGeometry(0.5, 12, 0.5);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.position.set(8, 2, 0);
            activeLayerGroup.add(track);

            // Progress Fill
            const fillGeo = new THREE.BoxGeometry(0.6, 12, 0.6);
            // shift pivot to bottom
            fillGeo.translate(0, 6, 0);
            const fillMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.8 });
            layerState.progressFill = new THREE.Mesh(fillGeo, fillMat);
            layerState.progressFill.position.set(8, -4, 0);
            layerState.progressFill.scale.y = 0.01;
            activeLayerGroup.add(layerState.progressFill);
        }

        function animateSoftwareLayer(time) {
            // Loop 0 to 3 seconds
            const cycle = (time % 3) / 3;

            // Move arrow down continuously
            const arrowY = 6 - (cycle * 12);
            layerState.arrow.position.y = arrowY;

            // Highlight active block
            const activeIndex = Math.floor(cycle * 3);
            layerState.blocks.forEach((b, idx) => {
                if (idx === activeIndex) {
                    b.material.color.setHex(0xffffff);
                    b.material.emissive.setHex(0x3b82f6);
                    b.scale.setScalar(1.05);
                } else {
                    b.material.color.setHex(0x888888);
                    b.material.emissive.setHex(0x000000);
                    b.scale.setScalar(1.0);
                }
            });

            // Accumulate Progress
            layerState.progressFill.scale.y = Math.max(0.01, cycle);
        }

        // -- Layer 2: Memory (RAM) --
        function buildRAMLayer() {
            clearActiveLayer();
            layerState = { stackFrames: [], pointer: null };
            camera.position.set(0, 15, 20);
            camera.lookAt(0, 0, 0);

            // Base RAM Grid
            const gridGeo = new THREE.PlaneGeometry(20, 20, 10, 10);
            const gridMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, wireframe: true });
            const grid = new THREE.Mesh(gridGeo, gridMat);
            grid.rotation.x = -Math.PI / 2;
            activeLayerGroup.add(grid);

            // Stack Frame base
            const baseGeo = new THREE.BoxGeometry(6, 1, 6);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.set(-4, 0.5, 0);
            activeLayerGroup.add(base);

            // Local primitives pushing
            for (let i = 0; i < 4; i++) {
                const geo = new THREE.BoxGeometry(5, 1, 5);
                const mat = new THREE.MeshStandardMaterial({ color: 0xa855f7, transparent: true, opacity: 0.2 });
                const block = new THREE.Mesh(geo, mat);
                block.position.set(-4, 1.5 + i * 1.2, 0);
                activeLayerGroup.add(block);
                layerState.stackFrames.push(block);
            }

            // Pointer line indicating static tracking
            const ptrGeo = new THREE.CylinderGeometry(0.1, 0.1, 8);
            const ptrMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            layerState.pointer = new THREE.Mesh(ptrGeo, ptrMat);
            layerState.pointer.position.set(2, 4, 0);
            activeLayerGroup.add(layerState.pointer);
        }

        function animateRAMLayer(time) {
            const cycle = (time % 4) / 4;
            const activeLevel = Math.floor(cycle * 5); // 0 to 4

            // Grow/Shrink stack visually
            layerState.stackFrames.forEach((frame, idx) => {
                if (idx < activeLevel) {
                    frame.material.opacity = 0.9;
                    frame.material.emissive.setHex(0x9333ea);
                } else {
                    frame.material.opacity = 0.2;
                    frame.material.emissive.setHex(0x000000);
                }
            });

            // Move static pointer alongside stack
            layerState.pointer.position.y = 0.5 + (activeLevel * 1.2);
        }

        // -- Layer 3: CPU & Registers --
        function buildCPULayer() {
            clearActiveLayer();
            layerState = { buses: [], pcValue: null };
            camera.position.set(0, 0, 25);
            camera.lookAt(0, 0, 0);

            // PC Register
            const pcGeo = new THREE.BoxGeometry(4, 3, 2);
            const pcMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, wireframe: true });
            const pc = new THREE.Mesh(pcGeo, pcMat);
            pc.position.set(-8, 5, 0);
            activeLayerGroup.add(pc);

            // IR Register
            const ir = new THREE.Mesh(pcGeo, pcMat);
            ir.position.set(8, 5, 0);
            activeLayerGroup.add(ir);

            // ALU
            const aluGeo = new THREE.CylinderGeometry(4, 2, 4, 3);
            const aluMat = new THREE.MeshStandardMaterial({ color: 0x047857 });
            const alu = new THREE.Mesh(aluGeo, aluMat);
            alu.position.set(0, -4, 0);
            alu.rotation.z = Math.PI;
            activeLayerGroup.add(alu);

            // Control Buses (Lines)
            const busMat = new THREE.LineBasicMaterial({ color: 0xf59e0b });
            const points1 = [new THREE.Vector3(-8, 3.5, 0), new THREE.Vector3(-8, 0, 0), new THREE.Vector3(0, -2, 0)];
            const line1Geo = new THREE.BufferGeometry().setFromPoints(points1);
            activeLayerGroup.add(new THREE.Line(line1Geo, busMat));

            const points2 = [new THREE.Vector3(8, 3.5, 0), new THREE.Vector3(8, 0, 0), new THREE.Vector3(0, -2, 0)];
            const line2Geo = new THREE.BufferGeometry().setFromPoints(points2);
            activeLayerGroup.add(new THREE.Line(line2Geo, busMat));

            // Data Pulse
            const pulseGeo = new THREE.SphereGeometry(0.5);
            const pulseMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
            const pulse = new THREE.Mesh(pulseGeo, pulseMat);
            activeLayerGroup.add(pulse);
            layerState.pulse = pulse;
        }

        function animateCPULayer(time) {
            const speed = time * 2;
            const cycle = speed % 2;

            // Pulse traveling along bus from PC to ALU
            if (cycle < 1) {
                // PC to ALU
                layerState.pulse.position.set(-8 + (cycle * 8), 3.5 - (cycle * 5.5), 0);
            } else {
                // IR to ALU
                const c2 = cycle - 1;
                layerState.pulse.position.set(8 - (c2 * 8), 3.5 - (c2 * 5.5), 0);
            }
        }

        // -- Layer 4: GPU Raster --
        function buildGPULayer() {
            clearActiveLayer();
            layerState = { pixels: [], streamPlane: null };
            camera.position.set(-15, 15, 20);
            camera.lookAt(0, 0, 0);

            // Framebuffer Grid
            const size = 10;
            const offset = -4.5;
            for (let x = 0; x < size; x++) {
                for (let z = 0; z < size; z++) {
                    const geo = new THREE.BoxGeometry(0.8, 0.2, 0.8);
                    const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(offset + x, 0, offset + z);
                    activeLayerGroup.add(mesh);
                    layerState.pixels.push({ mesh, x, z });
                }
            }

            // Data stream plane
            const planeGeo = new THREE.PlaneGeometry(10, 10);
            const planeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
            layerState.streamPlane = new THREE.Mesh(planeGeo, planeMat);
            layerState.streamPlane.rotation.x = -Math.PI / 2;
            activeLayerGroup.add(layerState.streamPlane);
        }

        function animateGPULayer(time) {
            const wave = (Math.sin(time * 2) + 1) / 2; // 0 to 1
            const planeY = 8 - (wave * 8);
            layerState.streamPlane.position.y = planeY;

            // Rasterize (light up) pixels as plane hits them
            layerState.pixels.forEach(p => {
                const dist = Math.sqrt(p.x * p.x + p.z * p.z);
                const colorVal = Math.max(0, 1 - Math.abs(planeY - dist * 0.2));

                if (colorVal > 0.5) {
                    p.mesh.material.color.setHex(0x38bdf8);
                    p.mesh.material.emissive.setHex(0x0284c7);
                } else {
                    p.mesh.material.color.setHex(0x1e293b);
                    p.mesh.material.emissive.setHex(0x000000);
                }
            });
        }

        // -- Layer 5: Corrector (Logic > Data) --
        function buildCorrectorLayer() {
            clearActiveLayer();
            layerState = { passiveData: [], exeLine: null };
            camera.position.set(0, 10, 25);
            camera.lookAt(0, 0, 0);

            // The Unyielding Execution Path (Logic)
            const pipeGeo = new THREE.CylinderGeometry(1, 1, 20, 32);
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, transparent: true, opacity: 0.9 });
            const pipe = new THREE.Mesh(pipeGeo, pipeMat);
            pipe.rotation.z = Math.PI / 2;
            activeLayerGroup.add(pipe);

            // Central execution pulse
            const exeGeo = new THREE.SphereGeometry(1.5);
            const exeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            layerState.exeLine = new THREE.Mesh(exeGeo, exeMat);
            activeLayerGroup.add(layerState.exeLine);

            // Passive Data Blocks scattered around
            for (let i = 0; i < 6; i++) {
                const geo = new THREE.BoxGeometry(2, 2, 2);
                const mat = new THREE.MeshStandardMaterial({ color: 0x475569, transparent: true, opacity: 0.5 });
                const block = new THREE.Mesh(geo, mat);
                const x = -8 + (i * 3.2);
                block.position.set(x, (i % 2 === 0 ? 4 : -4), (Math.random() - 0.5) * 5);
                activeLayerGroup.add(block);
                layerState.passiveData.push(block);
            }
        }

        function animateCorrectorLayer(time) {
            const speed = time * 3;
            const cycle = (speed % 20) - 10; // -10 to 10

            // Pulse moves linearly
            layerState.exeLine.position.x = cycle;

            // Passive data only reacts when logic touches its vertical slice
            layerState.passiveData.forEach(block => {
                if (Math.abs(block.position.x - cycle) < 1.5) {
                    block.material.color.setHex(0xec4899);
                    block.material.opacity = 1.0;
                    block.rotation.y += 0.1;
                } else {
                    block.material.color.setHex(0x475569);
                    block.material.opacity = 0.5;
                }
            });
        }

        // ==========================================
        // 3. RENDER LOOP & TAB SWITCHING
        // ==========================================

        function animate() {
            animationId = requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            switch (currentLayerIndex) {
                case 0: animateSoftwareLayer(time); break;
                case 1: animateRAMLayer(time); break;
                case 2: animateCPULayer(time); break;
                case 3: animateGPULayer(time); break;
                case 4: animateCorrectorLayer(time); break;
            }

            // Slow idle rotation for effect on overall scene
            if (currentLayerIndex !== 0 && currentLayerIndex !== 2) {
                activeLayerGroup.rotation.y = Math.sin(time * 0.2) * 0.1;
            } else {
                activeLayerGroup.rotation.y = 0;
            }

            renderer.render(scene, camera);
        }

        window.switchTab = function (index) {
            currentLayerIndex = index;
            clock.start(); // Reset time for predictable animation start

            // Update UI buttons
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Rebuild Scene Data
            switch (index) {
                case 0: buildSoftwareLayer(); break;
                case 1: buildRAMLayer(); break;
                case 2: buildCPULayer(); break;
                case 3: buildGPULayer(); break;
                case 4: buildCorrectorLayer(); break;
            }

            updateUI(index);
        }

        function updateUI(index) {
            const data = layerData[index];
            document.getElementById('context-title').innerText = data.title;
            document.getElementById('context-desc').innerHTML = data.desc;

            const mathContainer = document.getElementById('math-container');
            if (data.math) {
                mathContainer.classList.remove('hidden');
                katex.render(data.math, mathContainer, {
                    throwOnError: false,
                    displayMode: true
                });
            } else {
                mathContainer.classList.add('hidden');
            }
        }

        // Boot
        initWebGL();

    </script>
</body>

</html>
