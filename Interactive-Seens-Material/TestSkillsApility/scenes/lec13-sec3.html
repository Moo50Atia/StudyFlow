      --font-size-body: 16px;

      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;

      --color-creative: #a855f7;
      --color-danger: #ef4444;
      --color-focus: #eab308;
      --color-programming: #06b6d4;

      --layer-software: var(--color-learning);

    * {

      padding: 0;

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);

      color: #f1f5f9;

    .controls-title {

    .control-group {

    }

    .control-label {

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;

    .drawer-close {

      right: var(--space-lg);

      border: none;
      color: #94a3b8;

    .drawer-close:hover {

    .drawer-grid {
      display: grid;

    .scene-card {

    .scene-card:hover {

    .scene-card.active {

    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;

    @media (max-width: 768px) {

        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {

        flex-direction: column;
        padding: var(--space-md);

        position: relative;
        z-index: var(--z-panel);
      }
    }

<body>

  <script>
    const allScenes = [
      { id: "lec11-sec1", title: "Abstraction Covers", path: "lec11-sec1.html" },
      { id: "lec11-sec2", title: "Encapsulation Safety Lock", path: "lec11-sec2.html" },
      { id: "lec12-sec1", title: "Stability Tower Collapse", path: "lec12-sec1.html" },
      { id: "lec12-sec2", title: "Tight Coupling Snaps", path: "lec12-sec2.html" },
      { id: "lec13-sec1", title: "Getter/Setter Bridge Channels", path: "lec13-sec1.html" },
      { id: "lec13-sec2", title: "The Const Read-Only Filter", path: "lec13-sec2.html" },
      { id: "lec13-sec3", title: "Setter Boundary Validation", path: "lec13-sec3.html" }
    ];

    // ----------------------------------------------------
    // SCENE GENERATOR SUBCLASS: Setter Validation Gate
    // ----------------------------------------------------
    class ValidationGenerator extends BaseGenerator {
      create() {
        // 1. Central Core Mesh (Private variable, size represents value)
        const coreGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.2, 32);
        this.coreMat = new THREE.MeshPhysicalMaterial({
          color: 0x06b6d4, // Cyan
          roughness: 0.2,
          metalness: 0.8,
          emissive: 0x06b6d4,
          emissiveIntensity: 0.3
        });
        this.core = new THREE.Mesh(coreGeo, this.coreMat);
        this.core.position.set(2.0, 0, 0);
        this.scene.add(this.core);
        this.meshes.push(this.core);
        this.geometries.push(coreGeo);
        this.materials.push(this.coreMat);

        // 2. Validation Gate (Grid Plane at X=-1.0)
        const gateGeo = new THREE.BoxGeometry(0.1, 3.0, 3.0);
        this.gateMat = new THREE.MeshPhysicalMaterial({
          color: 0x06b6d4, // Cyan initially
          roughness: 0.1,
          metalness: 0.5,
          transmission: 0.8,
          transparent: true,
          opacity: 0.4
        });
        this.gate = new THREE.Mesh(gateGeo, this.gateMat);
        this.gate.position.set(-1.0, 0, 0);
        this.scene.add(this.gate);
        this.meshes.push(this.gate);
        this.geometries.push(gateGeo);
        this.materials.push(this.gateMat);

        // Grid lines overlay on the gate
        const wireframe = new THREE.WireframeGeometry(gateGeo);
        const line = new THREE.LineSegments(wireframe);
        line.material.depthTest = false;
        line.material.opacity = 0.5;
        line.material.transparent = true;
        this.gate.add(line);

        // 3. Incoming Packet Particle
        const packetGeo = new THREE.SphereGeometry(0.15, 16, 16);
        this.packetMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.packet = new THREE.Mesh(packetGeo, this.packetMat);
        this.packet.position.set(-4.5, 0, 0);
        this.packet.visible = false;
        this.scene.add(this.packet);
        this.meshes.push(this.packet);
        this.geometries.push(packetGeo);
        this.materials.push(this.packetMat);

        this.inputValue = 50.0;
        this.animationTimer = 0;
        this.isValid = true;
        this.isAnimating = false;
      }

      update(delta, speed) {
        this.core.rotation.y += delta * 0.2 * speed;

        if (this.isAnimating) {
          this.animationTimer += delta * 1.5 * speed;

          if (this.isValid) {
            // Valid animation: flows through gate, hits core, scales it
            if (this.animationTimer < 1.0) {
              this.packet.position.x = -4.5 + this.animationTimer * 6.5; // moves past gate (x=-1) to core (x=2)
              this.gateMat.color.setHex(0x22c55e); // Gate turns green
              this.gateMat.opacity = 0.7;
            } else if (this.animationTimer < 1.3) {
              // Hit core, trigger scale change
              this.packet.visible = false;
              const targetScale = this.inputValue / 50.0; // scale between 0 and 2
              this.core.scale.y += (targetScale - this.core.scale.y) * 0.2 * speed;
              this.coreMat.color.setHex(0x22c55e); // glow green
            } else {
              this.gateMat.color.setHex(0x06b6d4); // restore gate
              this.gateMat.opacity = 0.4;
              this.coreMat.color.lerp(new THREE.Color(0x06b6d4), 0.1);
              if (this.animationTimer > 2.0) {
                this.isAnimating = false;
              }
            }
          } else {
            // Invalid animation: hits gate and gets rejected
            if (this.animationTimer < 0.54) {
              // Travels towards gate: x = -4.5 to -1.0
              this.packet.position.x = -4.5 + this.animationTimer * 6.5;
            } else if (this.animationTimer < 1.5) {
              // Collides with gate: gate flashes red, packet bounces off
              this.gateMat.color.setHex(0xef4444);
              this.gateMat.opacity = 0.8;
              this.packetMat.color.setHex(0xef4444);
              this.packet.position.x = -1.0 - (this.animationTimer - 0.54) * 1.5;
              this.packet.position.y = Math.sin((this.animationTimer - 0.54) * Math.PI) * 0.6;
            } else {
              // Reset elements, core untouched
              this.packet.visible = false;
              this.gateMat.color.setHex(0x06b6d4);
              this.gateMat.opacity = 0.4;
              if (this.animationTimer > 2.2) {
                this.isAnimating = false;
              }
            }
          }
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        this.coreMat.wireframe = false;
        this.gateMat.wireframe = false;

        switch (tabIndex) {
          case 0:
            this.smoothTransitionColor(this.coreMat, 0x06b6d4);
            this.smoothTransitionColor(this.gateMat, 0x06b6d4);
            break;
          case 1: // RAM
            this.coreMat.wireframe = true;
            this.gateMat.wireframe = true;
            this.smoothTransitionColor(this.coreMat, 0xa855f7);
            this.smoothTransitionColor(this.gateMat, 0xa855f7);
            break;
          case 2: // CPU
            this.smoothTransitionColor(this.coreMat, 0x06b6d4);
            this.smoothTransitionColor(this.gateMat, 0x06b6d4);
            break;
          case 3: // GPU FX
            this.coreMat.wireframe = true;
            this.gateMat.wireframe = true;
            this.smoothTransitionColor(this.coreMat, 0x22c55e);
            this.smoothTransitionColor(this.gateMat, 0x22c55e);
            break;
          case 4: // Corrector
            this.smoothTransitionColor(this.coreMat, 0xef4444);
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'slider') {
          this.inputValue = parseFloat(value);
          document.getElementById('input-val').innerText = this.inputValue;
        } else if (controlId === 'submit') {
          this.isAnimating = true;
          this.animationTimer = 0;
          this.isValid = (this.inputValue >= 0 && this.inputValue <= 100);
          
          this.packet.position.set(-4.5, 0, 0);
          this.packet.visible = true;
          this.packetMat.color.setHex(this.isValid ? 0x22c55e : 0xef4444);
        }
      }
    }

    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 3, 7);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;

        this.lights = new LightingManager(this.scene);
        this.generator = new ValidationGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.9);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const rim = new THREE.PointLight(0x06b6d4, 0.6, 12);
        rim.position.set(0, 3, -2);
        this.scene.add(rim);
        this.lights.push(rim);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec13-sec3",
          title: "Setter Boundary Validation",
          breadcrumb: "Lecture 13 · Section 3",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `<p>Setters are validation checkpoints. They examine incoming parameters and reject invalid values before they can reach the private core, keeping the object stable.</p>
                        <p>Use the slider to set values. Valid range is $[0, 100]$. Values inside this range pass the <i>Validation Gate</i> and successfully resize the 3D data core. Values outside (e.g. negative or $> 100$) are blocked by the gate, causing a warning flash while the core remains intact.</p>`
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `<p><strong>Stack/Heap:</strong> The input argument is stored temporarily in the Stack frame. The object's heap address is only written to after checking the validation condition:</p>
                        <p>$$\\text{if } (\\text{arg} \\ge 0 \\land \\text{arg} \\le 100)$$</p>`
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `<p>The CPU processes conditional branches:</p>
                        <p>$$\\text{cmp } [esp+4], 100 \\implies \\text{jg } \\text{error}$$</p>
                        <p>$$\\text{cmp } [esp+4], 0 \\implies \\text{jl } \\text{error}$$</p>
                        <p>Only if both checks pass does the CPU execute the memory write instruction: $$\\text{mov } [rcx+8], val$$.</p>`
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `<p>A gate grid is rendered in 3D. Signals representing valid inputs pass through as green vectors and scale the core vault. Invalid inputs collide with the grid, flash red, and dissolve into dust particles.</p>`
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `<p><strong>Misconception Shattered:</strong> A setter is not a passive assignment operator. It is a logical firewall. By forcing all updates through this gateway, a class guarantees that the physical hardware state of the object never enters a corrupt or logically impossible configuration.</p>`
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.buildNavigationHub();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.switchTab(parseInt(btn.dataset.tab));
          });
        });

        const paramSlider = document.getElementById('param-slider');
        if (paramSlider) {
          paramSlider.addEventListener('input', (e) => {
            this.sceneManager.generator.handleInteraction('slider', e.target.value);
          });
        }

        document.getElementById('btn-submit').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('submit');
        });

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        const currentIdx = allScenes.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        if (currentIdx > 0) {
          prevBtn.href = allScenes[currentIdx - 1].path;
        } else {
          prevBtn.style.opacity = 0.5;
          prevBtn.style.pointerEvents = 'none';
        }

        if (currentIdx < allScenes.length - 1) {
          nextBtn.href = allScenes[currentIdx + 1].path;
        } else {
          nextBtn.style.opacity = 0.5;
          nextBtn.style.pointerEvents = 'none';
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const btn = document.querySelector(`.tab-btn[data-tab="${parseInt(e.key) - 1}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      buildNavigationHub() {
        const grid = document.getElementById('drawer-scenes-grid');
        grid.innerHTML = '';
        allScenes.forEach(scene => {
          const card = document.createElement('a');
          card.className = `scene-card ${scene.id === this.sceneConfig.id ? 'active' : ''}`;
          card.href = scene.path;
          card.innerHTML = `
            <div class="card-meta">${scene.id.toUpperCase()}</div>
            <div style="font-weight:600;color:#fff;margin-top:4px;">${scene.title}</div>
          `;
          grid.appendChild(card);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
</html>
