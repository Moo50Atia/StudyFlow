<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 3 Sec 2 — Object Behavior & Methods</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {

      background: rgba(255, 255, 255, 0.12);

    .details-panel.glass-panel {

      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;

    .details-content p {

      background: rgba(255, 255, 255, 0.08);

      border-radius: 4px;
      font-family: monospace;

      color: #e2e8f0;

    .controls-panel.glass-panel {

      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;

    .control-slider::-webkit-slider-thumb {

      height: 18px;
      border-radius: 50%;

      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .interactive-btn {
      background: var(--color-learning);
      border: none;
      color: white;
      padding: 10px 12px;
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;

      text-align: center;
    }

    .interactive-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;

    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;

        padding: var(--space-md);

        gap: var(--space-sm);
      }
      #mobile-layout-wrap {

        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }

  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {}
      update(delta, speed) {}
      
      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }

      handleInteraction(controlId, value) {}

      dispose() {
        this.meshes.forEach(mesh => this.scene.remove(mesh));
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }

      createTextTexture(text, bgColor = 'rgba(0,0,0,0)', textColor = '#ffffff', fontSize = 32) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bgColor !== 'rgba(0,0,0,0)') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.font = `bold ${fontSize}px 'Inter', sans-serif`;
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
      }
    }

    // ----------------------------------------------------
    // LEC 3 SEC 2 GENERATOR (OBJECT BEHAVIOR & METHODS)
    // ----------------------------------------------------
    class BehaviorMethodsGenerator extends BaseGenerator {
      constructor(scene) {
        super(scene);
        this.time = 0;
        this.gearSpeed = 1.0;
        this.radiusVal = 1.5;
        this.pulseIntensity = 0;
      }

      create() {
        // Transparent outer boundary cylinder representing object containment scope
        const shellGeo = new THREE.CylinderGeometry(1.8, 1.8, 2.2, 32, 1, true);
        this.shellMat = new THREE.MeshPhysicalMaterial({
          color: 0x3b82f6,
          transparent: true,
          opacity: 0.15,
          side: THREE.DoubleSide,
          roughness: 0.2
        });
        const shellMesh = new THREE.Mesh(shellGeo, this.shellMat);
        this.scene.add(shellMesh);
        this.meshes.push(shellMesh);
        this.geometries.push(shellGeo);
        this.materials.push(this.shellMat);

        // Procedural interlocking gear 1 (Large, cyan)
        this.gearGroup1 = this.createProceduralGear(0.75, 12, 0x06b6d4);
        this.gearGroup1.position.set(-0.6, 0, 0);
        this.scene.add(this.gearGroup1);

        // Procedural interlocking gear 2 (Small, purple)
        this.gearGroup2 = this.createProceduralGear(0.48, 8, 0xa855f7);
        this.gearGroup2.position.set(0.6, 0.4, 0);
        this.scene.add(this.gearGroup2);

        // Floating dynamic math blackboard above containment scope
        this.boardTex = this.createTextTexture("Area = 3.14 * r^2 = 7.07", 'rgba(15,18,30,0.85)', '#ffffff', 32);
        const boardGeo = new THREE.PlaneGeometry(2.6, 0.5);
        this.boardMat = new THREE.MeshBasicMaterial({
          map: this.boardTex,
          transparent: true,
          side: THREE.DoubleSide
        });
        this.billboard = new THREE.Mesh(boardGeo, this.boardMat);
        this.billboard.position.set(0, 1.6, 0);
        this.scene.add(this.billboard);
        this.meshes.push(this.billboard);
        this.geometries.push(boardGeo);
        this.materials.push(this.boardMat);
      }

      createProceduralGear(radius, teethCount, colorHex) {
        const group = new THREE.Group();
        const centerGeo = new THREE.CylinderGeometry(radius, radius, 0.2, 16);
        const mat = new THREE.MeshPhysicalMaterial({
          color: colorHex,
          roughness: 0.2,
          metalness: 0.1,
          clearcoat: 0.8
        });
        const center = new THREE.Mesh(centerGeo, mat);
        center.rotation.x = Math.PI / 2;
        group.add(center);
        this.meshes.push(center);
        this.geometries.push(centerGeo);
        this.materials.push(mat);

        // Add teeth
        const toothGeo = new THREE.BoxGeometry(0.12, 0.16, 0.2);
        this.geometries.push(toothGeo);
        for (let i = 0; i < teethCount; i++) {
          const angle = (i / teethCount) * Math.PI * 2;
          const tooth = new THREE.Mesh(toothGeo, mat);
          tooth.position.set(Math.cos(angle) * (radius + 0.04), Math.sin(angle) * (radius + 0.04), 0);
          tooth.rotation.z = angle;
          group.add(tooth);
          this.meshes.push(tooth);
        }
        return group;
      }

      update(delta, speed) {
        this.time += delta * speed;

        // Apply pulse decay
        if (this.pulseIntensity > 0) {
          this.pulseIntensity -= delta * 1.5;
        }

        // spin gears (gear 1 is CCW, gear 2 is CW)
        const rotationDelta = delta * 1.2 * (1.0 + this.pulseIntensity * 3) * this.gearSpeed * speed;
        this.gearGroup1.rotation.z += rotationDelta;
        this.gearGroup2.rotation.z -= rotationDelta * (12 / 8); // ratio offset to interlock teeth

        // float blackboard
        this.billboard.position.y = 1.6 + Math.sin(this.time * 1.5) * 0.05;
      }

      updateCalculationUI() {
        const area = Math.PI * this.radiusVal * this.radiusVal;
        
        const canvas = this.billboard.material.map.image;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(15,18,30,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = `bold 32px 'Inter', sans-serif`;
        ctx.fillStyle = '#22c55e';
        ctx.fillText(`Area: ${area.toFixed(2)}  (r = ${this.radiusVal.toFixed(1)})`, canvas.width / 2, canvas.height / 2);

        this.billboard.material.map.needsUpdate = true;
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);

        switch (tabIndex) {
          case 0: // Software (Nice blue boundaries)
            this.shellMat.opacity = 0.15;
            this.shellMat.wireframe = false;
            break;

          case 1: // RAM Map (Wireframes highlighting layouts)
            this.shellMat.opacity = 0.1;
            this.shellMat.wireframe = true;
            break;

          case 2: // CPU / RIP (Pointer highlighted)
            break;

          case 3: // GPU FX
            break;

          case 4: // Corrector (Alert state Red)
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'getArea') {
          this.pulseIntensity = 1.0;
          this.updateCalculationUI();
          this.flashGearColors(0x22c55e);
        } else if (controlId === 'setRadius') {
          this.pulseIntensity = 1.0;
          // cycle radius size
          this.radiusVal = this.radiusVal === 1.5 ? 2.2 : 1.5;
          this.updateCalculationUI();
          this.flashGearColors(0xa855f7);
        } else if (controlId === 'speed') {
          this.gearSpeed = value;
        }
      }

      flashGearColors(hex) {
        // flash gear materials temporarily
        const oldG1Color = this.gearGroup1.children[0].material.color.clone();
        this.gearGroup1.children[0].material.color.setHex(hex);
        this.gearGroup2.children[0].material.color.setHex(hex);
        setTimeout(() => {
          this.gearGroup1.children[0].material.color.copy(oldG1Color);
          this.gearGroup2.children[0].material.color.copy(oldG1Color);
        }, 300);
      }

      dispose() {
        super.dispose();
        // clear group meshes
        this.gearGroup1.clear();
        this.gearGroup2.clear();
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(
          45,
          this.container.clientWidth / this.container.clientHeight,
          0.1,
          100
        );
        this.camera.position.set(0, 1.2, 6.5);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;

        this.lights = new LightingManager(this.scene);
        this.generator = new BehaviorMethodsGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.85);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0x06b6d4, 0.35);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec3-sec2",
          title: "Object Behavior & Methods",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `
                <p>An object is an entity bundling behaviors (methods). Rotating gears inside the transparent capsule represent the active method execution engines.</p>
                <p>Clicking <code>getArea()</code> or <code>setRadius()</code> spins the gears fast, updates calculations, and displays results on the overlay blackboard.</p>
              `
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `
                <p>Method machine instructions reside in the <strong>Code Segment</strong>. When a method executes:</p>
                <ul>
                  <li><strong>Stack Frame:</strong> Linkage pointers, return address, and parameters are pushed.</li>
                  <li><strong>Heap Address:</strong> Object data sits at instance offsets (e.g. <code>0x01B8</code>).</li>
                </ul>
              `
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `
                <p>The Instruction Pointer ($RIP$) jumps to method instruction block (e.g., <code>0x00401120</code>). CPU executes floating-point multiplication (FMUL) using registers:</p>
                $$Area = \\pi \\times \\text{radius}^2$$
                <p>The result is then returned back to calling stack pointer offset.</p>
              `
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `
                <p>The rotating gear meshes are updated in VRAM using matrix vertex transformations. Click execution flashes the gear nodes, translating state shifts into color uniforms.</p>
              `
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `
                <div style="border-left: 4px solid var(--color-danger); padding-left: 10px; background: rgba(239, 68, 68, 0.08); padding-top: 8px; padding-bottom: 8px; border-radius: 4px;">
                  <strong style="color:var(--color-danger)">Misconception Shattered:</strong>
                  <p>Students confuse code behavior with data space, thinking object methods are physically stored in Stack/Heap cells. In raw hardware, behavior is read-only logic in the text segment; only variables occupy data space inside RAM chips.</p>
                </div>
              `
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.initDrawerGrid();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
            this.sceneManager.generator.handleInteraction('speed', val);
          });
        }

        document.getElementById('area-btn').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('getArea');
        });

        document.getElementById('radius-btn').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('setRadius');
        });

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      initDrawerGrid() {
        const grid = document.getElementById('drawer-scenes-grid');
        const items = [
          { name: "Procedural Execution Flow", path: "lec1-sec1.html", lec: "Lec 1 · Sec 1" },
          { name: "Shared Global Scope", path: "lec1-sec2.html", lec: "Lec 1 · Sec 2" },
          { name: "Decentralized Object Networks", path: "lec2-sec1.html", lec: "Lec 2 · Sec 1" },
          { name: "Object Identity & State", path: "lec2-sec2.html", lec: "Lec 2 · Sec 2" },
          { name: "Encapsulation Barriers", path: "lec2-sec3.html", lec: "Lec 2 · Sec 3" },
          { name: "State & Representation", path: "lec3-sec1.html", lec: "Lec 3 · Sec 1" },
          { name: "Object Behavior & Methods", path: "lec3-sec2.html", lec: "Lec 3 · Sec 2" },
          { name: "Class Blueprint vs. Instances", path: "lec3-sec3.html", lec: "Lec 3 · Sec 3" }
        ];

        grid.innerHTML = items.map(item => `
          <a class="scene-card" href="${item.path}">
            <div style="font-size: 12px; color: #94a3b8;">${item.lec}</div>
            <div style="font-weight: 600; color: #fff;">${item.name}</div>
          </a>
        `).join('');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
