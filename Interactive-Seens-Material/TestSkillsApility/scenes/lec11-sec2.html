<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 11 Sec 2 — Encapsulation: Protected Core</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      --color-learning: #3b82f6;
      --color-success: #22c55e;
      --color-attention: #f59e0b;
      --color-creative: #a855f7;
      --color-danger: #ef4444;
      --color-focus: #eab308;
      --color-programming: #06b6d4;

      --layer-software: var(--color-learning);
      --layer-ram: var(--color-creative);
      --layer-cpu: var(--color-programming);
      --layer-gpu: var(--color-success);
      --layer-corrector: var(--color-danger);

      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    .scene-card.active {
      border-color: var(--color-learning);
      background: rgba(59, 130, 246, 0.1);
    }

    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>
</head>
<body>

  <script>
    const allScenes = [
      { id: "lec11-sec1", title: "Abstraction Covers", path: "lec11-sec1.html" },
      { id: "lec11-sec2", title: "Encapsulation Safety Lock", path: "lec11-sec2.html" },
      { id: "lec12-sec1", title: "Stability Tower Collapse", path: "lec12-sec1.html" },
      { id: "lec12-sec2", title: "Tight Coupling Snaps", path: "lec12-sec2.html" },
      { id: "lec13-sec1", title: "Getter/Setter Bridge Channels", path: "lec13-sec1.html" },
      { id: "lec13-sec2", title: "The Const Read-Only Filter", path: "lec13-sec2.html" },
      { id: "lec13-sec3", title: "Setter Boundary Validation", path: "lec13-sec3.html" }
    ];

    // ----------------------------------------------------
    // SCENE GENERATOR SUBCLASS: Encapsulation Safety Lock
    // ----------------------------------------------------
    class EncapsulationGenerator extends BaseGenerator {
      create() {
        // 1. Central Core Mesh (Private Data)
        const coreGeo = new THREE.SphereGeometry(1.0, 32, 32);
        this.coreMat = new THREE.MeshPhysicalMaterial({
          color: 0x06b6d4, // Cyan
          roughness: 0.1,
          metalness: 0.1,
          emissive: 0x06b6d4,
          emissiveIntensity: 0.5,
          transmission: 0.6,
          thickness: 1.5
        });
        this.coreMesh = new THREE.Mesh(coreGeo, this.coreMat);
        this.scene.add(this.coreMesh);
        this.meshes.push(this.coreMesh);
        this.materials.push(this.coreMat);
        this.geometries.push(coreGeo);

        // 2. Rotating Defensive Shield Gear Arches (Encapsulation Barrier)
        this.barrierGroup = new THREE.Group();
        this.scene.add(this.barrierGroup);
        this.meshes.push(this.barrierGroup);

        const archGeo = new THREE.TorusGeometry(2.0, 0.15, 16, 100, Math.PI * 1.5);
        this.archMat1 = new THREE.MeshPhysicalMaterial({
          color: 0xef4444, // Red barrier initially
          roughness: 0.2,
          metalness: 0.8,
          emissive: 0xef4444,
          emissiveIntensity: 0.2
        });
        this.arch1 = new THREE.Mesh(archGeo, this.archMat1);
        this.barrierGroup.add(this.arch1);
        this.materials.push(this.archMat1);
        this.geometries.push(archGeo);

        const arch2Geo = new THREE.TorusGeometry(2.0, 0.15, 16, 100, Math.PI * 0.4);
        this.archMat2 = new THREE.MeshPhysicalMaterial({
          color: 0x22c55e, // Green gateway arch
          roughness: 0.2,
          metalness: 0.8,
          emissive: 0x22c55e,
          emissiveIntensity: 0.2
        });
        this.arch2 = new THREE.Mesh(arch2Geo, this.archMat2);
        this.arch2.rotation.z = Math.PI * 1.5; // Offset to create a gap
        this.barrierGroup.add(this.arch2);
        this.materials.push(this.archMat2);
        this.geometries.push(arch2Geo);

        // 3. Incoming Packet Particle
        const packetGeo = new THREE.SphereGeometry(0.15, 16, 16);
        this.packetMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.packetMesh = new THREE.Mesh(packetGeo, this.packetMat);
        this.packetMesh.position.set(-6, 0, 0);
        this.packetMesh.visible = false;
        this.scene.add(this.packetMesh);
        this.meshes.push(this.packetMesh);
        this.geometries.push(packetGeo);
        this.materials.push(this.packetMat);

        this.accessType = null;
        this.animationTimer = 0;
      }

      update(delta, speed) {
        // Slow constant rotations
        this.barrierGroup.rotation.y += delta * 0.3 * speed;
        this.coreMesh.rotation.y -= delta * 0.1 * speed;

        // Packet Flow Animation
        if (this.packetMesh.visible) {
          this.animationTimer += delta * 1.5 * speed;

          if (this.accessType === 'direct') {
            // Direct write animation (Bounces off)
            if (this.animationTimer < 1.0) {
              // Interpolate towards shield boundary
              this.packetMesh.position.x = -6 + this.animationTimer * 4.0;
            } else if (this.animationTimer < 2.0) {
              // Collide, flash red, and bounce backward
              this.packetMat.color.setHex(0xef4444);
              this.packetMesh.position.x = -2 - (this.animationTimer - 1.0) * 1.5;
              this.packetMesh.position.y = Math.sin((this.animationTimer - 1.0) * Math.PI) * 0.5;
            } else {
              this.packetMesh.visible = false;
              this.accessType = null;
            }
          } else if (this.accessType === 'public') {
            // Public gateway animation (Aligns and passes)
            // Align gateway to incoming angle (0 rad position in local space)
            const targetRot = Math.PI; // Match entry side
            this.barrierGroup.rotation.y += (targetRot - this.barrierGroup.rotation.y) * 0.1;

            if (this.animationTimer < 1.0) {
              // Interpolate through gateway
              this.packetMesh.position.x = -6 + this.animationTimer * 6.0;
              this.packetMat.color.setHex(0x22c55e);
            } else if (this.animationTimer < 1.5) {
              // Merge into core, pulse core
              this.packetMesh.visible = false;
              this.coreMat.emissiveIntensity = 2.0;
              this.coreMat.color.setHex(0x22c55e);
            } else {
              // Decay pulse back to normal cyan
              this.coreMat.emissiveIntensity += (0.5 - this.coreMat.emissiveIntensity) * 0.1;
              this.coreMat.color.lerp(new THREE.Color(0x06b6d4), 0.1);
              if (this.animationTimer > 2.5) {
                this.accessType = null;
              }
            }
          }
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        this.archMat1.wireframe = false;
        this.archMat2.wireframe = false;
        this.coreMat.wireframe = false;

        switch (tabIndex) {
          case 0: // Software (Realistic rendering)
            this.smoothTransitionColor(this.archMat1, 0xef4444);
            this.smoothTransitionColor(this.coreMat, 0x06b6d4);
            break;
          case 1: // RAM Map (Wireframes showing storage blocks)
            this.archMat1.wireframe = true;
            this.archMat2.wireframe = true;
            this.coreMat.wireframe = true;
            this.smoothTransitionColor(this.archMat1, 0xa855f7);
            this.smoothTransitionColor(this.coreMat, 0xa855f7);
            break;
          case 2: // CPU / RIP (Routing instructions)
            this.smoothTransitionColor(this.archMat1, 0x06b6d4);
            this.smoothTransitionColor(this.coreMat, 0x06b6d4);
            break;
          case 3: // GPU FX
            this.archMat1.wireframe = true;
            this.smoothTransitionColor(this.archMat1, 0x22c55e);
            break;
          case 4: // Corrector (Danger highlights)
            this.smoothTransitionColor(this.archMat1, 0xef4444);
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'direct') {
          this.accessType = 'direct';
          this.animationTimer = 0;
          this.packetMesh.position.set(-6, 0, 0);
          this.packetMat.color.setHex(0xffffff);
          this.packetMesh.visible = true;
        } else if (controlId === 'public') {
          this.accessType = 'public';
          this.animationTimer = 0;
          this.packetMesh.position.set(-6, 0, 0);
          this.packetMat.color.setHex(0xffffff);
          this.packetMesh.visible = true;
        }
      }
    }

    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 4, 8);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;

        this.lights = new LightingManager(this.scene);
        this.generator = new EncapsulationGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.9);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const point = new THREE.PointLight(0xa855f7, 0.7, 10);
        point.position.set(-2, 3, 2);
        this.scene.add(point);
        this.lights.push(point);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec11-sec2",
          title: "Encapsulation: Protected Core",
          breadcrumb: "Lecture 11 · Section 2",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `<p>Encapsulation locks variables inside a class. Access to internal fields is forbidden except through predefined method gateways (getters/setters).</p>
                        <p>Use the controls on the left to try to write directly to the <strong>Core Data</strong> or access it through the <strong>Getter/Setter Gateway</strong>. Direct writes bounce off the protective shield, whereas gateway writes align the outer lock gears to let the data pass.</p>`
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `<p><strong>Memory Layout:</strong> An object's state fields and function pointers reside in a contiguous block in the heap/stack. A physical barrier in RAM does not exist; access modifiers are compile-time boundaries.</p>
                        <p>$$\\text{Object Address} = 0x07FFA010$$</p>
                        <p>$$\\text{Offset}(\\text{private\\_data}) = +8 \\text{ bytes}$$</p>`
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `<p>Direct external modifications compile to errors. Safe method paths compile to instruction jumps (<code>call</code>) to the method address. The CPU validates values before writing to the registers:</p>
                        <p>$$RIP \\leftarrow \\text{Method Address}$$</p>`
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `<p>The 3D canvas draws the private data core vault and the rotating outer lock gears. Signal streams are animated. Direct access results in red colliding lines. Authorized gateway access shows matching gears aligning ($$\\theta_{\\text{lock}} = 0$$) and data particles passing inside.</p>`
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `<p><strong>Misconception Shattered:</strong> Encapsulation is a compile-time check, not a hardware-enforced CPU barrier. Raw pointers can bypass encapsulation completely (via pointer casting). Encapsulation exists to enforce software design integrity, preventing accidental bugs and illegal states.</p>`
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.buildNavigationHub();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.switchTab(parseInt(btn.dataset.tab));
          });
        });

        document.getElementById('btn-direct').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('direct');
        });
        document.getElementById('btn-public').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('public');
        });

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        const currentIdx = allScenes.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        if (currentIdx > 0) {
          prevBtn.href = allScenes[currentIdx - 1].path;
        } else {
          prevBtn.style.opacity = 0.5;
          prevBtn.style.pointerEvents = 'none';
        }

        if (currentIdx < allScenes.length - 1) {
          nextBtn.href = allScenes[currentIdx + 1].path;
        } else {
          nextBtn.style.opacity = 0.5;
          nextBtn.style.pointerEvents = 'none';
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const btn = document.querySelector(`.tab-btn[data-tab="${parseInt(e.key) - 1}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      buildNavigationHub() {
        const grid = document.getElementById('drawer-scenes-grid');
        grid.innerHTML = '';
        allScenes.forEach(scene => {
          const card = document.createElement('a');
          card.className = `scene-card ${scene.id === this.sceneConfig.id ? 'active' : ''}`;
          card.href = scene.path;
          card.innerHTML = `
            <div class="card-meta">${scene.id.toUpperCase()}</div>
            <div style="font-weight:600;color:#fff;margin-top:4px;">${scene.title}</div>
          `;
          grid.appendChild(card);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
</html>
