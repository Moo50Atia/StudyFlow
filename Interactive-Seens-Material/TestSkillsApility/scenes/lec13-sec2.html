<head>

  <style>
    :root {
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      --color-learning: #3b82f6;
      --color-success: #22c55e;
      --color-attention: #f59e0b;
      --color-creative: #a855f7;
      --color-danger: #ef4444;
      --color-focus: #eab308;
      --color-programming: #06b6d4;

      --layer-software: var(--color-learning);
      --layer-ram: var(--color-creative);
      --layer-cpu: var(--color-programming);
      --layer-gpu: var(--color-success);
      --layer-corrector: var(--color-danger);

      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    .glass-panel {
      background: var(--glass-bg);

      -webkit-backdrop-filter: blur(var(--glass-blur));

      border-radius: var(--radius-card);

    header.glass-panel {

      top: var(--space-md);
      left: var(--space-md);

    }

      color: #94a3b8;
    }

    .header-title {

      font-weight: 600;

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);

      z-index: var(--z-panel);

      padding: 0 var(--space-xs);

      border-bottom: 1px solid rgba(255, 255, 255, 0.1);

      padding: var(--space-lg);

    .controls-title {

      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;

    #nav-drawer {

      background: rgba(2, 6, 23, 0.85);

      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    .scene-card.active {
      border-color: var(--color-learning);
      background: rgba(59, 130, 246, 0.1);
    }

    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>

<body>

  <script>
    const allScenes = [
      { id: "lec11-sec1", title: "Abstraction Covers", path: "lec11-sec1.html" },
      { id: "lec11-sec2", title: "Encapsulation Safety Lock", path: "lec11-sec2.html" },
      { id: "lec12-sec1", title: "Stability Tower Collapse", path: "lec12-sec1.html" },
      { id: "lec12-sec2", title: "Tight Coupling Snaps", path: "lec12-sec2.html" },
      { id: "lec13-sec1", title: "Getter/Setter Bridge Channels", path: "lec13-sec1.html" },
      { id: "lec13-sec2", title: "The Const Read-Only Filter", path: "lec13-sec2.html" },
      { id: "lec13-sec3", title: "Setter Boundary Validation", path: "lec13-sec3.html" }
    ];

    // ----------------------------------------------------
    // SCENE GENERATOR SUBCLASS: Const Read-Only Filter
    // ----------------------------------------------------
    class ConstGenerator extends BaseGenerator {
      create() {
        // 1. Original Data Block (Green to signify correct/safe state)
        const blockGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        this.blockMat = new THREE.MeshPhysicalMaterial({
          color: 0x22c55e, // Green
          roughness: 0.1,
          metalness: 0.8,
          emissive: 0x22c55e,
          emissiveIntensity: 0.2
        });
        this.block = new THREE.Mesh(blockGeo, this.blockMat);
        this.block.position.set(-2.5, 0, 0);
        this.scene.add(this.block);
        this.meshes.push(this.block);
        this.geometries.push(blockGeo);
        this.materials.push(this.blockMat);

        // 2. Const Filter Pane (Yellow translucent partition sheet)
        const paneGeo = new THREE.BoxGeometry(0.1, 3.5, 3.5);
        this.paneMat = new THREE.MeshPhysicalMaterial({
          color: 0xeab308, // Yellow
          transmission: 0.8,
          roughness: 0.2,
          transparent: true,
          opacity: 0.6
        });
        const pane = new THREE.Mesh(paneGeo, this.paneMat);
        pane.position.set(0.2, 0, 0);
        this.scene.add(pane);
        this.meshes.push(pane);
        this.geometries.push(paneGeo);
        this.materials.push(this.paneMat);

        // Track path
        const trackGeo = new THREE.BoxGeometry(5.0, 0.1, 0.4);
        const trackMat = new THREE.MeshPhysicalMaterial({ color: 0x475569, roughness: 0.5 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.position.set(0, -0.9, 0);
        this.scene.add(track);
        this.meshes.push(track);
        this.geometries.push(trackGeo);
        this.materials.push(trackMat);

        // 3. Floating duplicate packet
        const packetGeo = new THREE.SphereGeometry(0.15, 16, 16);
        this.packetMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
        this.packet = new THREE.Mesh(packetGeo, this.packetMat);
        this.packet.visible = false;
        this.scene.add(this.packet);
        this.meshes.push(this.packet);
        this.geometries.push(packetGeo);
        this.materials.push(this.packetMat);

        this.animationTimer = 0;
        this.action = null;
      }

      update(delta, speed) {
        this.block.rotation.y += delta * 0.2 * speed;
        this.block.rotation.x += delta * 0.1 * speed;

        if (this.action === 'read') {
          this.animationTimer += delta * speed;
          if (this.animationTimer < 2.0) {
            // Particle splits from block, flows across yellow filter plane
            this.packet.position.x = -2.5 + this.animationTimer * 2.5; // reaches 2.5 on right
            
            // As it passes the filter plane (x=0.2), it duplicates cleanly
            if (this.packet.position.x > 0.2) {
              this.packetMat.color.setHex(0xeab308); // changes to yellow output
            } else {
              this.packetMat.color.setHex(0x22c55e); // matches original green
            }
          } else {
            this.packet.visible = false;
            this.action = null;
          }
        } else if (this.action === 'write') {
          this.animationTimer += delta * speed * 2;
          // Attempt write animation (red arrow flies from right, hits filter plane and collapses)
          if (this.animationTimer < 1.0) {
            this.packet.position.x = 2.5 - this.animationTimer * 2.3; // towards filter (0.2)
            this.packetMat.color.setHex(0xef4444); // Red warning
          } else if (this.animationTimer < 2.0) {
            // Collides with filter: filter plane flashes red
            this.paneMat.color.setHex(0xef4444);
            this.paneMat.emissiveIntensity = 1.0;
            this.packet.visible = false;
          } else {
            this.paneMat.color.setHex(0xeab308); // Restores yellow filter color
            this.paneMat.emissiveIntensity = 0.0;
            this.action = null;
          }
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        this.blockMat.wireframe = false;
        this.paneMat.wireframe = false;

        switch (tabIndex) {
          case 0:
            this.smoothTransitionColor(this.blockMat, 0x22c55e);
            this.smoothTransitionColor(this.paneMat, 0xeab308);
            break;
          case 1: // RAM
            this.blockMat.wireframe = true;
            this.paneMat.wireframe = true;
            this.smoothTransitionColor(this.blockMat, 0xa855f7);
            this.smoothTransitionColor(this.paneMat, 0xa855f7);
            break;
          case 2: // CPU
            this.smoothTransitionColor(this.blockMat, 0x06b6d4);
            this.smoothTransitionColor(this.paneMat, 0x06b6d4);
            break;
          case 3: // GPU FX
            this.blockMat.wireframe = true;
            this.paneMat.wireframe = true;
            this.smoothTransitionColor(this.blockMat, 0x22c55e);
            this.smoothTransitionColor(this.paneMat, 0x22c55e);
            break;
          case 4: // Corrector
            this.smoothTransitionColor(this.blockMat, 0xef4444);
            break;
        }
      }

      handleInteraction(controlId) {
        if (controlId === 'read') {
          this.action = 'read';
          this.animationTimer = 0;
          this.packet.position.set(-2.5, 0, 0);
          this.packet.visible = true;
        } else if (controlId === 'write') {
          this.action = 'write';
          this.animationTimer = 0;
          this.packet.position.set(2.5, 0, 0);
          this.packet.visible = true;
        }
      }
    }

    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 3, 7);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;

        this.lights = new LightingManager(this.scene);
        this.generator = new ConstGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.95);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const rim = new THREE.PointLight(0xeab308, 0.5, 10);
        rim.position.set(0, 3, -2);
        this.scene.add(rim);
        this.lights.push(rim);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec13-sec2",
          title: "The Const Read-Only Filter",
          breadcrumb: "Lecture 13 · Section 2",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `<p>A read channel with a const filter pane. Values duplicate through the filter; original objects remain untouched.</p>
                        <p>Click the <strong>Read Data (Const)</strong> button. You will see a data packet duplicate from the original data block. The duplicate passes through the <i>Const Filter</i> pane to the client output, while the original block remains locked and completely unmodified.</p>`
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `<p><strong>Stack/Heap Allocation:</strong> The original data stays in heap memory. A local temporary copy of the variable (e.g. <code>double</code> value, 8 bytes) is allocated on the Stack to be returned. The heap address space is marked read-only during function execution:</p>
                        <p>$$\\text{Stack Copy} = \\text{Heap Data}$$</p>`
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `<p>The compiler enforces a const pointer on the implicit 'this' argument:</p>
                        <p>$$\\text{const ClassName* const this}$$</p>
                        <p>No store assembly instructions (like <code>mov [rcx], rax</code>) are allowed by the compiler, guaranteeing no registers write back to the object's memory offset at the hardware level.</p>`
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `<p>A glowing green block represents the original object. An extraction tunnel leads through a yellow semi-transparent "Const Filter" plane. When reading, a duplicate green sphere splits off the block, travels through the filter, and outputs. Original block stays green and intact.</p>`
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `<p><strong>Misconception Shattered:</strong> Getter methods should never change internal class states. Marking a getter method as <code>const</code> ensures that the compiler physically prevents any accidental writes to the object's variables, protecting hardware registers from side effects.</p>`
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.buildNavigationHub();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.switchTab(parseInt(btn.dataset.tab));
          });
        });

        document.getElementById('btn-read').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('read');
        });
        document.getElementById('btn-write').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('write');
        });

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        const currentIdx = allScenes.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        if (currentIdx > 0) {
          prevBtn.href = allScenes[currentIdx - 1].path;
        } else {
          prevBtn.style.opacity = 0.5;
          prevBtn.style.pointerEvents = 'none';
        }

        if (currentIdx < allScenes.length - 1) {
          nextBtn.href = allScenes[currentIdx + 1].path;
        } else {
          nextBtn.style.opacity = 0.5;
          nextBtn.style.pointerEvents = 'none';
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const btn = document.querySelector(`.tab-btn[data-tab="${parseInt(e.key) - 1}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      buildNavigationHub() {
        const grid = document.getElementById('drawer-scenes-grid');
        grid.innerHTML = '';
        allScenes.forEach(scene => {
          const card = document.createElement('a');
          card.className = `scene-card ${scene.id === this.sceneConfig.id ? 'active' : ''}`;
          card.href = scene.path;
          card.innerHTML = `
            <div class="card-meta">${scene.id.toUpperCase()}</div>
            <div style="font-weight:600;color:#fff;margin-top:4px;">${scene.title}</div>
          `;
          grid.appendChild(card);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
</html>
