<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 15 · Sec 1 — Constructor Solid Stamping</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Layer Specific Fallbacks */
      --layer-software: var(--color-learning);
      --layer-ram: var(--color-creative);
      --layer-cpu: var(--color-programming);
      --layer-gpu: var(--color-success);
      --layer-corrector: var(--color-danger);

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* WebGL Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    /* Glass Panels Layout */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Panel */
    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    /* Tabs Navigation (Bottom Center) */
    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    /* Details Panel (Right Side) */
    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    /* Controls Panel (Left Side) */
    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .btn-action {
      background: var(--color-learning);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-button);
      padding: var(--space-sm) var(--space-md);
      font-weight: 600;
      cursor: pointer;
      transition: all 180ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-action:active {
      transform: translateY(1px);
    }

    /* Drawer Panel (Index / Navigation Hub Overlay) */
    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    /* Accessibility visible focus */
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .details-panel.glass-panel {
        width: 320px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>
</head>
<body>
  
  <!-- WebGL Render Target -->
  <div id="canvas-container"></div>
  
  <!-- Mobile Content Wrapper -->
  <div id="mobile-layout-wrap">
    
    <!-- Floating Header -->
    <header class="glass-panel">
      <div class="header-title-section">
        <span class="header-breadcrumb">Lecture 15 · Section 1</span>
        <h1 class="header-title" id="scene-title">Constructor Solid Stamping</h1>
      </div>
      <div class="header-nav">
        <a class="nav-btn" href="#" id="prev-btn">← Prev</a>
        <button class="nav-btn" id="menu-btn" aria-label="Open Navigation Hub">☰ Index</button>
        <a class="nav-btn" href="#" id="next-btn">Next →</a>
      </div>
    </header>

    <!-- Controls Panel -->
    <section class="controls-panel glass-panel" aria-label="Scene Controls">
      <h2 class="controls-title">Interactive Panel</h2>
      
      <button class="btn-action" id="action-btn">
        <span>Run Constructor</span>
      </button>

      <div class="control-group">
        <div class="control-label">
          <span>Simulation Speed</span>
          <span id="speed-val">1.0x</span>
        </div>
        <input type="range" class="control-slider" id="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" aria-label="Adjust speed multiplier">
      </div>
    </section>

    <!-- Details Panel -->
    <main class="details-panel glass-panel" aria-label="Explanation Panel">
      <h2 class="details-title" id="panel-layer-name">THE SOFTWARE LAYER</h2>
      <div class="details-content" id="panel-dynamic-content">
        <!-- Render content here dynamically -->
      </div>
    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar glass-panel" aria-label="Visual Layers Selection">
      <button class="tab-btn active" data-tab="0" style="--layer-color: var(--layer-software)">Software</button>
      <button class="tab-btn" data-tab="1" style="--layer-color: var(--layer-ram)">RAM Map</button>
      <button class="tab-btn" data-tab="2" style="--layer-color: var(--layer-cpu)">CPU / RIP</button>
      <button class="tab-btn" data-tab="3" style="--layer-color: var(--layer-gpu)">GPU FX</button>
      <button class="tab-btn" data-tab="4" style="--layer-color: var(--layer-corrector)">Corrector</button>
    </nav>
    
  </div>

  <!-- Interactive Index Navigation Hub Drawer Overlay -->
  <div id="nav-drawer" role="dialog" aria-modal="true" aria-label="Interactive Navigation Grid">
    <div class="drawer-content glass-panel">
      <button class="drawer-close" id="drawer-close-btn" aria-label="Close index hub">×</button>
      <h2 class="header-title" style="margin-bottom: var(--space-md);">All Visual Scenes</h2>
      <div class="drawer-grid" id="drawer-scenes-grid">
        <!-- Grid dynamically loaded -->
      </div>
    </div>
  </div>

  <!-- JavaScript Manager Infrastructure -->
  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {
        // Build scene-specific geometries here (Abstract)
      }

      update(delta, speed) {
        // Frame animation logic (Abstract)
      }

      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }

      handleInteraction(controlId, value) {
        // Interaction logic (Abstract)
      }

      dispose() {
        this.meshes.forEach(mesh => {
          this.scene.remove(mesh);
          if (mesh.geometry) mesh.geometry.dispose();
          if (mesh.material) {
            if (Array.isArray(mesh.material)) {
              mesh.material.forEach(m => m.dispose());
            } else {
              mesh.material.dispose();
            }
          }
        });
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        if (!material.color) return;
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }
    }

    // ----------------------------------------------------
    // CUSTOM GENERATOR FOR THIS SECTION
    // ----------------------------------------------------
    class SectionGenerator extends BaseGenerator {
      create() {
        // Create grid floor representing memory cells
        const gridHelper = new THREE.GridHelper(10, 10, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = -1;
        this.scene.add(gridHelper);
        this.meshes.push(gridHelper);

        // Target Object (Uninitialized Wireframe initially)
        const objectGeometry = new THREE.BoxGeometry(2, 2, 2);
        this.objectMaterial = new THREE.MeshPhysicalMaterial({
          color: 0x3b82f6,
          wireframe: true,
          transparent: true,
          opacity: 0.8,
          metalness: 0.1,
          roughness: 0.9
        });
        this.targetObject = new THREE.Mesh(objectGeometry, this.objectMaterial);
        this.targetObject.position.set(0, 0, 0);
        this.scene.add(this.targetObject);
        this.meshes.push(this.targetObject);
        this.geometries.push(objectGeometry);
        this.materials.push(this.objectMaterial);

        // Constructor Stamp Tool
        const stampGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.4, 32);
        this.stampMaterial = new THREE.MeshStandardMaterial({
          color: 0xf59e0b,
          metalness: 0.8,
          roughness: 0.2,
          emissive: 0x3a2000
        });
        this.stampObject = new THREE.Mesh(stampGeometry, this.stampMaterial);
        this.stampObject.position.set(0, 4, 0);
        this.scene.add(this.stampObject);
        this.meshes.push(this.stampObject);
        this.geometries.push(stampGeometry);
        this.materials.push(this.stampMaterial);

        // Glowing Core Inside (Solid representation)
        const coreGeometry = new THREE.SphereGeometry(0.8, 32, 32);
        this.coreMaterial = new THREE.MeshPhysicalMaterial({
          color: 0x06b6d4,
          emissive: 0x013040,
          transparent: true,
          opacity: 0.0, // Invisible initially
          roughness: 0.1,
          metalness: 0.1
        });
        this.coreObject = new THREE.Mesh(coreGeometry, this.coreMaterial);
        this.coreObject.position.set(0, 0, 0);
        this.scene.add(this.coreObject);
        this.meshes.push(this.coreObject);
        this.geometries.push(coreGeometry);
        this.materials.push(this.coreMaterial);

        // Glow ring effect at impact
        const ringGeo = new THREE.RingGeometry(0.1, 2.0, 32);
        this.ringMat = new THREE.MeshBasicMaterial({
          color: 0x22c55e,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide
        });
        this.impactRing = new THREE.Mesh(ringGeo, this.ringMat);
        this.impactRing.rotation.x = Math.PI / 2;
        this.impactRing.position.y = 1.05;
        this.scene.add(this.impactRing);
        this.meshes.push(this.impactRing);
        this.geometries.push(ringGeo);
        this.materials.push(this.ringMat);

        // State variables
        this.isStamping = false;
        this.stampTime = 0;
        this.isInitialized = false;
      }

      update(delta, speed) {
        const speedMult = speed * 1.5;
        
        // Gentle rotation of target object if initialized
        if (this.isInitialized) {
          this.targetObject.rotation.y += delta * 0.5 * speed;
          this.targetObject.rotation.x += delta * 0.2 * speed;
          this.coreObject.rotation.y -= delta * 0.8 * speed;
        }

        // Stamping animation state machine
        if (this.isStamping) {
          this.stampTime += delta * speedMult;
          
          if (this.stampTime < 1.0) {
            // Descend stamp down to target top (Y = 1.2)
            const targetY = 1.2;
            this.stampObject.position.y = THREE.MathUtils.lerp(4.0, targetY, this.stampTime);
            this.stampMaterial.emissive.setHex(0xff7700); // Heating up
          } 
          else if (this.stampTime >= 1.0 && this.stampTime < 1.3) {
            // Impact! Flash and solidfy
            this.stampObject.position.y = 1.2;
            if (!this.isInitialized) {
              this.isInitialized = true;
              
              // Morph materials to solid
              this.objectMaterial.wireframe = false;
              this.objectMaterial.opacity = 0.9;
              this.objectMaterial.roughness = 0.3;
              this.objectMaterial.clearcoat = 1.0;
              this.smoothTransitionColor(this.objectMaterial, '#3b82f6');
              
              // Light up core
              this.coreMaterial.opacity = 0.95;
              
              // Trigger flash ring
              this.ringMat.opacity = 1.0;
              this.impactRing.scale.set(0.1, 0.1, 0.1);
            }
            
            // Expand ring
            const ringScale = (this.stampTime - 1.0) * 10.0;
            this.impactRing.scale.set(ringScale, ringScale, ringScale);
            this.ringMat.opacity = 1.0 - (this.stampTime - 1.0) / 0.3;
          } 
          else if (this.stampTime >= 1.3 && this.stampTime < 2.3) {
            // Retract stamp to top (Y = 4)
            const retractProgress = (this.stampTime - 1.3);
            this.stampObject.position.y = THREE.MathUtils.lerp(1.2, 4.0, retractProgress);
            this.stampMaterial.emissive.setHex(0x3a2000); // Cool down
            this.ringMat.opacity = 0;
          } 
          else {
            // End of cycle
            this.isStamping = false;
            this.stampTime = 0;
            const actBtn = document.getElementById('action-btn');
            if (actBtn) actBtn.disabled = false;
          }
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        if (!this.isInitialized) return;

        switch (tabIndex) {
          case 0: // Software (Blue solid)
            this.objectMaterial.wireframe = false;
            this.smoothTransitionColor(this.objectMaterial, '#3b82f6');
            this.coreMaterial.opacity = 0.95;
            break;
          case 1: // RAM Map (Purple Wireframe)
            this.objectMaterial.wireframe = true;
            this.smoothTransitionColor(this.objectMaterial, '#a855f7');
            this.coreMaterial.opacity = 0.2;
            break;
          case 2: // CPU (Cyan highlights)
            this.objectMaterial.wireframe = false;
            this.smoothTransitionColor(this.objectMaterial, '#06b6d4');
            this.coreMaterial.opacity = 0.9;
            break;
          case 3: // GPU FX (Green Glowing Edge)
            this.objectMaterial.wireframe = true;
            this.smoothTransitionColor(this.objectMaterial, '#22c55e');
            this.coreMaterial.opacity = 0.8;
            break;
          case 4: // Corrector (Danger Red alert)
            this.objectMaterial.wireframe = false;
            this.smoothTransitionColor(this.objectMaterial, '#ef4444');
            this.coreMaterial.opacity = 0.1;
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'action') {
          // Restart/Trigger stamping cycle
          this.isStamping = true;
          this.stampTime = 0;
          this.isInitialized = false;

          // Reset object back to uninitialized wireframe
          this.objectMaterial.wireframe = true;
          this.objectMaterial.opacity = 0.8;
          this.objectMaterial.color.setHex(0x3b82f6);
          this.coreMaterial.opacity = 0.0;
          this.ringMat.opacity = 0;
        }
      }
    }

    // ----------------------------------------------------
    // LIGHTING CONFIGURATION MANAGER
    // ----------------------------------------------------
    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(5, 8, 5);
        key.castShadow = true;
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0x06b6d4, 0.35);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);

        const rim = new THREE.PointLight(0xa855f7, 0.7, 15);
        rim.position.set(0, 4, -3);
        this.scene.add(rim);
        this.lights.push(rim);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.1;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(4, 4, 8);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1;
        this.controls.minDistance = 3;
        this.controls.maxDistance = 25;

        this.lights = new LightingManager(this.scene);
        this.generator = new SectionGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        
        this.scenesList = [
          { id: "lec15-sec1", title: "Constructor Solid Stamping", url: "lec15-sec1.html" },
          { id: "lec15-sec2", title: "Scope Bounds Deallocation", url: "lec15-sec2.html" },
          { id: "lec15-sec3", title: "Initializer List Pipeline", url: "lec15-sec3.html" },
          { id: "lec15-sec4", title: "Constructor Delegation Routing", url: "lec15-sec4.html" },
          { id: "lec15-sec5", title: "Value Duplicates vs Pointer Refs", url: "lec15-sec5.html" },
          { id: "lec15-sec6", title: "Constructor Arrays", url: "lec15-sec6.html" }
        ];

        this.sceneConfig = {
          id: "lec15-sec1",
          title: "Constructor Solid Stamping",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `
                <p>Constructors are system-triggered routines executed automatically when an object is instantiated. They set up the default state, guaranteeing that the object is fully operational immediately.</p>
                <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; border: 1px dashed rgba(255,255,255,0.2); font-size: 13px;">
                  <span style="color:#64748b;">// Instantiation triggers constructor</span><br>
                  <span style="color:#06b6d4;">Circle</span> myCircle(<span style="color:#eab308;">5.0</span>);<br>
                  <span style="color:#22c55e;">double</span> a = myCircle.getArea();
                </div>
              `
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `
                <p>At instantiation, an empty contiguous memory block of size $N$ is allocated on the Stack or Heap. The constructor is immediately invoked to write parameter values directly into the fields:</p>
                <ul>
                  <li><strong>Stack Frame Allocation:</strong> $\\Delta RSP = -16$ bytes</li>
                  <li><strong>Object Address base ($RCX$):</strong> <code>0x007FFE80</code></li>
                  <li><strong>Stored attribute 'radius' (double):</strong> Value <code>5.0</code> written at offset <code>[RCX + 0]</code></li>
                </ul>
              `
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `
                <p>The compiler translates the instantiation statement into a stack setup instruction followed by a direct call to the constructor function. The object address is passed via the $RCX$ register as the implicit <code>this</code> pointer:</p>
                <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 13px;">
                  sub rsp, 16 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;; Allocate space on stack<br>
                  lea rcx, [rsp] &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;; Load this pointer into RCX<br>
                  movsd xmm0, qword [val] ; Load 5.0 parameter<br>
                  call Circle::Circle &nbsp;&nbsp;&nbsp;&nbsp;; RIP jumps to constructor
                </div>
                <p>Within the constructor, instruction register $RIP$ resolves the write offset: $$\\text{movsd qword ptr } [rcx], xmm0$$</p>
              `
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `
                <p>In WebGL and VRAM, the object begins as an uninitialized shell. Stamping it with the constructor applies solid shaders in VRAM, compiling material buffers, lighting uniforms, and enabling real-time vertex displacement matrices.</p>
                <p>Color interpolation blends states smoothly using a quadratic ease-in-out curve based on current simulation progress.</p>
              `
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `
                <p><strong>Misconception Shattered:</strong> Many believe constructors can be called manually at will like normal functions (e.g. <code>myCircle.Circle(5.0)</code>) to reinitialize an object. In C++, this is a syntax error.</p>
                <p>The constructor runs strictly during raw allocation. Once memory is initialized, it cannot be reconstructed without destructing and reallocating (e.g. via placement new).</p>
              `
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        // Tabs
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        // Action Button
        const actBtn = document.getElementById('action-btn');
        if (actBtn) {
          actBtn.addEventListener('click', () => {
            actBtn.disabled = true;
            this.sceneManager.generator.handleInteraction('action', null);
          });
        }

        // Speed Slider
        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        // Drawer Menu Toggles
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        // Populate Index Grid
        const drawerGrid = document.getElementById('drawer-scenes-grid');
        if (drawerGrid) {
          this.scenesList.forEach(scene => {
            const card = document.createElement('a');
            card.className = 'scene-card';
            card.href = scene.url;
            card.innerHTML = `
              <div style="font-size: 11px; color: var(--color-programming); font-weight: 600;">${scene.id.toUpperCase().replace('-', ' · ')}</div>
              <div style="font-size: 14px; font-weight: 600; color: #ffffff; margin-top: 4px;">${scene.title}</div>
            `;
            drawerGrid.appendChild(card);
          });
        }

        // Set Prev/Next links
        const currentIdx = this.scenesList.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        if (currentIdx > 0) {
          prevBtn.href = this.scenesList[currentIdx - 1].url;
        } else {
          prevBtn.style.opacity = '0.5';
          prevBtn.style.pointerEvents = 'none';
        }
        
        if (currentIdx < this.scenesList.length - 1) {
          nextBtn.href = this.scenesList[currentIdx + 1].url;
        } else {
          nextBtn.style.opacity = '0.5';
          nextBtn.style.pointerEvents = 'none';
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
          if (e.key === 'r' || e.key === 'R') {
            if (slider) {
              slider.value = 1.0;
              slider.dispatchEvent(new Event('input'));
            }
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
