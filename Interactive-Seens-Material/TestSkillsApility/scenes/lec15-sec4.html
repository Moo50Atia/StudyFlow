<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 15 · Sec 4 — Constructor Delegation Routing</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Layer Specific Fallbacks */
      --layer-software: var(--color-learning);
      --layer-ram: var(--color-creative);
      --layer-cpu: var(--color-programming);
      --layer-gpu: var(--color-success);
      --layer-corrector: var(--color-danger);

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* WebGL Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    /* Glass Panels Layout */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Panel */
    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    /* Tabs Navigation (Bottom Center) */
    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    /* Details Panel (Right Side) */
    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    /* Controls Panel (Left Side) */
    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .btn-action {
      background: var(--color-creative);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-button);
      padding: var(--space-sm) var(--space-md);
      font-weight: 600;
      cursor: pointer;
      transition: all 180ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-action:active {
      transform: translateY(1px);
    }

    /* Drawer Panel (Index / Navigation Hub Overlay) */
    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    /* Accessibility visible focus */
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .details-panel.glass-panel {
        width: 320px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>

<body>

  <!-- Interactive Index Navigation Hub Drawer Overlay -->

      <h2 class="header-title" style="margin-bottom: var(--space-md);">All Visual Scenes</h2>
      <div class="drawer-grid" id="drawer-scenes-grid">
        <!-- Grid dynamically loaded -->
      </div>
    </div>

  <!-- JavaScript Manager Infrastructure -->
  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {
        // Build scene-specific geometries here (Abstract)
      }

      update(delta, speed) {
        // Frame animation logic (Abstract)
      }

      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }

      handleInteraction(controlId, value) {
        // Interaction logic (Abstract)
      }

      dispose() {
        this.meshes.forEach(mesh => {
          this.scene.remove(mesh);
          if (mesh.geometry) mesh.geometry.dispose();
          if (mesh.material) {
            if (Array.isArray(mesh.material)) {
              mesh.material.forEach(m => m.dispose());
            } else {
              mesh.material.dispose();
            }
          }
        });
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        if (!material.color) return;
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }
    }

    // ----------------------------------------------------
    // CUSTOM GENERATOR FOR THIS SECTION
    // ----------------------------------------------------
    class SectionGenerator extends BaseGenerator {
      create() {
        // Floor grid
        const gridHelper = new THREE.GridHelper(10, 10, 0xa855f7, 0x1e293b);
        gridHelper.position.y = -1;
        this.scene.add(gridHelper);
        this.meshes.push(gridHelper);

        // Constructor A Block (Primary / Delegator)
        const boxGeo = new THREE.BoxGeometry(1.6, 1.0, 1.2);
        this.matA = new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, roughness: 0.3, transparent: true, opacity: 0.7 });
        this.boxA = new THREE.Mesh(boxGeo, this.matA);
        this.boxA.position.set(-2, 1.8, 0);
        this.scene.add(this.boxA);
        this.meshes.push(this.boxA);

        // Constructor B Block (Target / Delegatee)
        this.matB = new THREE.MeshPhysicalMaterial({ color: 0xa855f7, roughness: 0.3, transparent: true, opacity: 0.7 });
        this.boxB = new THREE.Mesh(boxGeo, this.matB);
        this.boxB.position.set(2, 1.8, 0);
        this.scene.add(this.boxB);
        this.meshes.push(this.boxB);
        
        this.geometries.push(boxGeo);
        this.materials.push(this.matA);
        this.materials.push(this.matB);

        // Object Memory Instance Block at bottom center
        const memGeo = new THREE.BoxGeometry(2.2, 0.8, 1.4);
        this.matMem = new THREE.MeshPhysicalMaterial({ color: 0x06b6d4, roughness: 0.1, transparent: true, opacity: 0.8 });
        this.boxMem = new THREE.Mesh(memGeo, this.matMem);
        this.boxMem.position.set(0, -0.4, 0);
        this.scene.add(this.boxMem);
        this.meshes.push(this.boxMem);
        this.geometries.push(memGeo);
        this.materials.push(this.matMem);

        // Inter-constructor bridge pipeline
        const bridgePath = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-1.2, 1.8, 0),
          new THREE.Vector3(0, 2.1, 0),
          new THREE.Vector3(1.2, 1.8, 0)
        ]);
        const bridgeGeo = new THREE.TubeGeometry(bridgePath, 20, 0.08, 8, false);
        this.bridgeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        const bridge = new THREE.Mesh(bridgeGeo, this.bridgeMat);
        this.scene.add(bridge);
        this.meshes.push(bridge);
        this.geometries.push(bridgeGeo);
        this.materials.push(this.bridgeMat);

        // Target memory write paths (tubes from constructors to memory block)
        const writePath1 = new THREE.CatmullRomCurve3([
          new THREE.Vector3(2.0, 1.3, 0),
          new THREE.Vector3(1.0, 0.3, 0),
          new THREE.Vector3(0.5, -0.0, 0)
        ]);
        const writeGeo = new THREE.TubeGeometry(writePath1, 15, 0.06, 8, false);
        this.writeMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.15 });
        const writeTube = new THREE.Mesh(writeGeo, this.writeMat);
        this.scene.add(writeTube);
        this.meshes.push(writeTube);
        this.geometries.push(writeGeo);
        this.materials.push(this.writeMat);

        // Execution signal particle
        const partGeo = new THREE.SphereGeometry(0.18, 16, 16);
        this.signalPart = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color: 0xeab308 }));
        this.signalPart.position.set(-2, 3.0, 0); // Start position
        this.signalPart.visible = false;
        this.scene.add(this.signalPart);
        this.meshes.push(this.signalPart);
        this.geometries.push(partGeo);

        // State machine variables
        this.isRunning = false;
        this.animTimer = 0;
      }

      update(delta, speed) {
        const simSpeed = speed * 0.9;
        
        if (this.isRunning) {
          this.animTimer += delta * simSpeed;
          this.signalPart.visible = true;

          // Animation timeline:
          // Phase 1 (0 to 1s): Signal enters Constructor A from top
          // Phase 2 (1s to 2s): Signal delegates from Constructor A to B across the bridge path
          // Phase 3 (2s to 3s): Constructor B writes variables into memory (signal descends to memory block)
          // Phase 4 (3s to 4s): Return signal returns to Constructor A, finishing scope
          
          if (this.animTimer < 0.8) {
            const t = this.animTimer / 0.8;
            this.signalPart.position.set(-2.0, THREE.MathUtils.lerp(3.0, 1.8, t), 0);
            this.matA.emissive.setHex(0x1a334d);
          } 
          else if (this.animTimer >= 0.8 && this.animTimer < 1.8) {
            const t = (this.animTimer - 0.8) / 1.0;
            // Lerp along curved bridge
            const px = THREE.MathUtils.lerp(-2.0, 2.0, t);
            const py = 1.8 + Math.sin(t * Math.PI) * 0.3;
            this.signalPart.position.set(px, py, 0);
            
            this.matA.emissive.setHex(0x000000);
            this.matB.emissive.setHex(0x3a1a4d);
          } 
          else if (this.animTimer >= 1.8 && this.animTimer < 2.8) {
            const t = (this.animTimer - 1.8) / 1.0;
            // Descend to memory block
            const px = THREE.MathUtils.lerp(2.0, 0.5, t);
            const py = THREE.MathUtils.lerp(1.3, -0.1, t);
            this.signalPart.position.set(px, py, 0);

            if (t >= 0.95) {
              this.matMem.emissive.setHex(0x02454f);
            }
          } 
          else if (this.animTimer >= 2.8 && this.animTimer < 3.8) {
            const t = (this.animTimer - 2.8) / 1.0;
            // Signal returns to Constructor A to execute its own body
            this.signalPart.position.set(
              THREE.MathUtils.lerp(0.5, -2.0, t),
              THREE.MathUtils.lerp(-0.1, 1.8, t),
              0
            );
            this.matMem.emissive.setHex(0x000000);
            this.matB.emissive.setHex(0x000000);
          } 
          else {
            this.isRunning = false;
            this.animTimer = 0;
            this.signalPart.visible = false;
            const actBtn = document.getElementById('action-btn');
            if (actBtn) actBtn.disabled = false;
          }
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        switch (tabIndex) {
          case 0: // Software (Blue/Purple theme)
            this.matA.color.setHex(0x3b82f6);
            this.matB.color.setHex(0xa855f7);
            this.bridgeMat.color.setHex(0xffffff);
            break;
          case 1: // RAM (Contiguous layout purple wireframe)
            this.matA.color.setHex(0xa855f7);
            this.matB.color.setHex(0xa855f7);
            this.bridgeMat.color.setHex(0xa855f7);
            break;
          case 2: // CPU (Cyan vectors)
            this.matA.color.setHex(0x06b6d4);
            this.matB.color.setHex(0x06b6d4);
            this.bridgeMat.color.setHex(0x06b6d4);
            break;
          case 3: // GPU FX (Glowing boundaries)
            this.matA.color.setHex(0x22c55e);
            this.matB.color.setHex(0x22c55e);
            this.bridgeMat.color.setHex(0x22c55e);
            break;
          case 4: // Corrector (Danger Red warning)
            this.matA.color.setHex(0xef4444);
            this.matB.color.setHex(0xef4444);
            this.bridgeMat.color.setHex(0xffffff);
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'action') {
          this.isRunning = true;
          this.animTimer = 0;
          this.matMem.emissive.setHex(0x000000);
          this.matA.emissive.setHex(0x000000);
          this.matB.emissive.setHex(0x000000);
          
          const actBtn = document.getElementById('action-btn');
          if (actBtn) actBtn.disabled = true;
        }
      }
    }

    // ----------------------------------------------------
    // LIGHTING CONFIGURATION MANAGER
    // ----------------------------------------------------
    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.85);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0xa855f7, 0.35);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 2.5, 7.5);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1;
        this.controls.minDistance = 3;
        this.controls.maxDistance = 25;

        this.lights = new LightingManager(this.scene);
        this.generator = new SectionGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        
        this.scenesList = [
          { id: "lec15-sec1", title: "Constructor Solid Stamping", url: "lec15-sec1.html" },
          { id: "lec15-sec2", title: "Scope Bounds Deallocation", url: "lec15-sec2.html" },
          { id: "lec15-sec3", title: "Initializer List Pipeline", url: "lec15-sec3.html" },
          { id: "lec15-sec4", title: "Constructor Delegation Routing", url: "lec15-sec4.html" },
          { id: "lec15-sec5", title: "Value Duplicates vs Pointer Refs", url: "lec15-sec5.html" },
          { id: "lec15-sec6", title: "Constructor Arrays", url: "lec15-sec6.html" }
        ];

        this.sceneConfig = {
          id: "lec15-sec4",
          title: "Constructor Delegation Routing",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `
                <p>Delegating constructors allow a primary constructor to pass initialization tasks to a target constructor in the same class. This centralizes validation and prevents duplicate initialization code blocks.</p>
                <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; border: 1px dashed rgba(255,255,255,0.2); font-size: 13px;">
                  <span style="color:#64748b;">// Default constructor delegates to 1-param</span><br>
                  Circle() : Circle(<span style="color:#eab308;">1.0</span>) {<br>
                  &nbsp;&nbsp;<span style="color:#64748b;">// Body executes after target returns</span><br>
                  }
                </div>
              `
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `
                <p>During delegation, execution remains on the same memory footprint block. The compiler loads call instructions on the stack frame that target the delegate constructor directly, utilizing the identical object instance pointer address.</p>
                <ul>
                  <li><strong>Active Instance:</strong> <code>0x007FFE90</code></li>
                  <li><strong>Delegation stack load:</strong> Passes the active instance reference pointer through the call hierarchy without creating new heap blocks.</li>
                </ul>
              `
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `
                <p>The compiler compiles delegating constructor loops by preserving register states, loading the address reference base in the RCX pointer register ($$RCX = \\text{this}$$), and issuing call vectors:</p>
                <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 13px;">
                  mov rcx, [rbp - 8] &nbsp;&nbsp;&nbsp;; Load this pointer into RCX<br>
                  movsd xmm0, [val_1.0] ; Load parameter into XMM0<br>
                  call Circle::Circle(double) ; Jump to delegator target (RIP)
                </div>
                <p>IP jumps back to delegating body curly brace immediately upon return instructions.</p>
              `
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `
                <p>Constructor blocks and delegating arrows are drawn as glossy 3D structures in WebGL. Vertices glow in real time using shader parameters that follow a sinusoidal pulse timer:</p>
                <p>$$\\text{Intensity} = 0.5 + 0.5 \\sin(t \\times \\text{speed})$$</p>
                <p>This allows visual tracing of the parameter flow vectors across construction contexts.</p>
              `
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `
                <p><strong>Misconception Shattered:</strong> Students frequently believe that writing <code>Circle() { Circle(1.0); }</code> inside a default constructor delegates correctly. <em>This is a dangerous bug!</em></p>
                <p>In C++, calling <code>Circle(1.0)</code> inside a body code block creates an independent, temporary object that is instantly destroyed. It does <strong>NOT</strong> initialize the fields of the calling instance. You MUST use the initializer list delegation syntax: <code>Circle() : Circle(1.0) {}</code>.</p>
              `
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        // Tabs
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        // Action Button
        const actBtn = document.getElementById('action-btn');
        if (actBtn) {
          actBtn.addEventListener('click', () => {
            this.sceneManager.generator.handleInteraction('action', null);
          });
        }

        // Speed Slider
        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        // Drawer Menu Toggles
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        // Populate Index Grid
        const drawerGrid = document.getElementById('drawer-scenes-grid');
        if (drawerGrid) {
          this.scenesList.forEach(scene => {
            const card = document.createElement('a');
            card.className = 'scene-card';
            card.href = scene.url;
            card.innerHTML = `
              <div style="font-size: 11px; color: var(--color-programming); font-weight: 600;">${scene.id.toUpperCase().replace('-', ' · ')}</div>
              <div style="font-size: 14px; font-weight: 600; color: #ffffff; margin-top: 4px;">${scene.title}</div>
            `;
            drawerGrid.appendChild(card);
          });
        }

        // Set Prev/Next links
        const currentIdx = this.scenesList.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        if (currentIdx > 0) {
          prevBtn.href = this.scenesList[currentIdx - 1].url;
        } else {
          prevBtn.style.opacity = '0.5';
          prevBtn.style.pointerEvents = 'none';
        }
        
        if (currentIdx < this.scenesList.length - 1) {
          nextBtn.href = this.scenesList[currentIdx + 1].url;
        } else {
          nextBtn.style.opacity = '0.5';
          nextBtn.style.pointerEvents = 'none';
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
          if (e.key === 'r' || e.key === 'R') {
            if (slider) {
              slider.value = 1.0;
              slider.dispatchEvent(new Event('input'));
            }
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
