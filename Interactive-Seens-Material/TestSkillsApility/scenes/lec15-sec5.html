<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 15 · Sec 5 — Value Duplicates vs Pointer Refs</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Layer Specific Fallbacks */
      --layer-software: var(--color-learning);
      --layer-ram: var(--color-creative);
      --layer-cpu: var(--color-programming);
      --layer-gpu: var(--color-success);
      --layer-corrector: var(--color-danger);

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* WebGL Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    /* Glass Panels Layout */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Panel */
    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    /* Tabs Navigation (Bottom Center) */
    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    /* Details Panel (Right Side) */
    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    /* Controls Panel (Left Side) */
    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .btn-action {
      background: var(--color-danger);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-button);
      padding: var(--space-sm) var(--space-md);
      font-weight: 600;
      cursor: pointer;
      transition: all 180ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-action:active {
      transform: translateY(1px);
    }

    /* Drawer Panel (Index / Navigation Hub Overlay) */
    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    /* Accessibility visible focus */
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .details-panel.glass-panel {
        width: 320px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <!-- Mobile Content Wrapper -->
  <div id="mobile-layout-wrap">
    
    <!-- Floating Header -->
    <header class="glass-panel">
      <div class="header-title-section">

    <!-- Details Panel -->
    <main class="details-panel glass-panel" aria-label="Explanation Panel">

      <div class="details-content" id="panel-dynamic-content">
        <!-- Render content here dynamically -->
      </div>

    <!-- Tab Bar -->
    <nav class="tab-bar glass-panel" aria-label="Visual Layers Selection">

  <!-- Interactive Index Navigation Hub Drawer Overlay -->
  <div id="nav-drawer" role="dialog" aria-modal="true" aria-label="Interactive Navigation Grid">
    <div class="drawer-content glass-panel">
      <button class="drawer-close" id="drawer-close-btn" aria-label="Close index hub">×</button>
      <h2 class="header-title" style="margin-bottom: var(--space-md);">All Visual Scenes</h2>
      <div class="drawer-grid" id="drawer-scenes-grid">
        <!-- Grid dynamically loaded -->
      </div>
    </div>
  </div>

  <!-- JavaScript Manager Infrastructure -->
  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {
        // Build scene-specific geometries here (Abstract)
      }

      update(delta, speed) {
        // Frame animation logic (Abstract)
      }

      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }

      handleInteraction(controlId, value) {
        // Interaction logic (Abstract)
      }

      dispose() {
        this.meshes.forEach(mesh => {
          this.scene.remove(mesh);
          if (mesh.geometry) mesh.geometry.dispose();
          if (mesh.material) {
            if (Array.isArray(mesh.material)) {
              mesh.material.forEach(m => m.dispose());
            } else {
              mesh.material.dispose();
            }
          }
        });
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        if (!material.color) return;
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }
    }

    // ----------------------------------------------------
    // CUSTOM GENERATOR FOR THIS SECTION
    // ----------------------------------------------------
    class SectionGenerator extends BaseGenerator {
      create() {
        // Floor grid
        const gridHelper = new THREE.GridHelper(10, 10, 0xef4444, 0x1e293b);
        gridHelper.position.y = -1;
        this.scene.add(gridHelper);
        this.meshes.push(gridHelper);

        // Original Object Mesh (Complex Torus Knot)
        const knotGeo = new THREE.TorusKnotGeometry(0.7, 0.22, 80, 12);
        this.origMat = new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, metalness: 0.1, roughness: 0.3 });
        this.originalMesh = new THREE.Mesh(knotGeo, this.origMat);
        this.originalMesh.position.set(-2.5, 1.2, 0);
        this.scene.add(this.originalMesh);
        this.meshes.push(this.originalMesh);

        // Cloned Object Mesh for Pass-by-value animation (starts invisible/inactive)
        this.cloneMat = new THREE.MeshPhysicalMaterial({ color: 0xef4444, transparent: true, opacity: 0 });
        this.cloneMesh = new THREE.Mesh(knotGeo, this.cloneMat);
        this.cloneMesh.position.set(-2.5, 1.2, 0);
        this.scene.add(this.cloneMesh);
        this.meshes.push(this.cloneMesh);

        this.geometries.push(knotGeo);
        this.materials.push(this.origMat);
        this.materials.push(this.cloneMat);

        // Function Scope target box (on the right)
        const scopeGeo = new THREE.BoxGeometry(2.0, 2.0, 2.0);
        this.scopeMat = new THREE.MeshPhysicalMaterial({ color: 0x1e293b, transparent: true, opacity: 0.4, roughness: 0.8 });
        const scopeBox = new THREE.Mesh(scopeGeo, this.scopeMat);
        scopeBox.position.set(2.5, 1.2, 0);
        this.scene.add(scopeBox);
        this.meshes.push(scopeBox);
        this.geometries.push(scopeGeo);
        this.materials.push(this.scopeMat);

        // Reference pointer line (glowing line linking right box to left object)
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(1.5, 1.2, 0),
          new THREE.Vector3(-1.8, 1.2, 0)
        ]);
        this.lineMat = new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0 });
        this.pointerLine = new THREE.Line(lineGeo, this.lineMat);
        this.scene.add(this.pointerLine);
        this.meshes.push(this.pointerLine);
        this.geometries.push(lineGeo);
        this.materials.push(this.lineMat);

        // Address capsule (moving along the reference line)
        const capGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.4, 16);
        this.capMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0 });
        this.addressCapsule = new THREE.Mesh(capGeo, this.capMat);
        this.addressCapsule.rotation.z = Math.PI / 2;
        this.addressCapsule.position.set(1.5, 1.2, 0);
        this.scene.add(this.addressCapsule);
        this.meshes.push(this.addressCapsule);
        this.geometries.push(capGeo);
        this.materials.push(this.capMat);

        // Animation States
        this.activeMode = null; // 'val', 'ref'
        this.animTimer = 0;
      }

      update(delta, speed) {
        // Rotating meshes
        this.originalMesh.rotation.y += delta * 0.6 * speed;
        this.originalMesh.rotation.x += delta * 0.2 * speed;
        
        if (this.activeMode === 'val') {
          this.animTimer += delta * speed * 0.9;
          this.cloneMesh.rotation.y = this.originalMesh.rotation.y;
          this.cloneMesh.rotation.x = this.originalMesh.rotation.x;

          // Slide copy from original position (X=-2.5) to function parameter (X=2.5)
          const progress = Math.min(this.animTimer / 1.5, 1.0);
          
          if (progress < 0.2) {
            // Fade in copy
            this.cloneMat.opacity = progress / 0.2;
          } 
          
          this.cloneMesh.position.x = THREE.MathUtils.lerp(-2.5, 2.5, progress);

          if (progress >= 1.0) {
            this.activeMode = null;
            this.enableButtons();
          }
        } 
        else if (this.activeMode === 'ref') {
          this.animTimer += delta * speed * 1.2;

          // Light up reference line, slide address capsule across
          const progress = Math.min(this.animTimer / 1.2, 1.0);
          
          this.lineMat.opacity = 0.8;
          this.capMat.opacity = 1.0;
          this.addressCapsule.position.x = THREE.MathUtils.lerp(1.5, -1.8, progress);

          if (progress >= 1.0) {
            // Pulse original object to show link is active
            this.origMat.emissive.setHex(0x02454f);
            setTimeout(() => {
              this.origMat.emissive.setHex(0x000000);
            }, 300);
            
            this.activeMode = null;
            this.enableButtons();
          }
        }
      }

      enableButtons() {
        const btnVal = document.getElementById('action-val');
        const btnRef = document.getElementById('action-ref');
        if (btnVal) btnVal.disabled = false;
        if (btnRef) btnRef.disabled = false;
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        switch (tabIndex) {
          case 0: // Software
            this.origMat.color.setHex(0x3b82f6);
            this.scopeMat.color.setHex(0x1e293b);
            break;
          case 1: // RAM
            this.origMat.color.setHex(0xa855f7);
            this.scopeMat.color.setHex(0xa855f7);
            break;
          case 2: // CPU
            this.origMat.color.setHex(0x06b6d4);
            this.scopeMat.color.setHex(0x06b6d4);
            break;
          case 3: // GPU FX
            this.origMat.color.setHex(0x22c55e);
            this.scopeMat.color.setHex(0x22c55e);
            break;
          case 4: // Corrector (Danger Red alert)
            this.origMat.color.setHex(0xef4444);
            this.scopeMat.color.setHex(0xffffff);
            break;
        }
      }

      handleInteraction(controlId, value) {
        this.animTimer = 0;
        this.activeMode = controlId;
        
        // Reset animation states
        this.cloneMesh.position.set(-2.5, 1.2, 0);
        this.cloneMat.opacity = 0;
        this.lineMat.opacity = 0;
        this.capMat.opacity = 0;
        this.addressCapsule.position.set(1.5, 1.2, 0);

        // Disable buttons
        const btnVal = document.getElementById('action-val');
        const btnRef = document.getElementById('action-ref');
        if (btnVal) btnVal.disabled = true;
        if (btnRef) btnRef.disabled = true;
      }
    }

    // ----------------------------------------------------
    // LIGHTING CONFIGURATION MANAGER
    // ----------------------------------------------------
    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.85);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0x06b6d4, 0.35);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 2.5, 7.5);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1;
        this.controls.minDistance = 3;
        this.controls.maxDistance = 25;

        this.lights = new LightingManager(this.scene);
        this.generator = new SectionGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        
        this.scenesList = [
          { id: "lec15-sec1", title: "Constructor Solid Stamping", url: "lec15-sec1.html" },
          { id: "lec15-sec2", title: "Scope Bounds Deallocation", url: "lec15-sec2.html" },
          { id: "lec15-sec3", title: "Initializer List Pipeline", url: "lec15-sec3.html" },
          { id: "lec15-sec4", title: "Constructor Delegation Routing", url: "lec15-sec4.html" },
          { id: "lec15-sec5", title: "Value Duplicates vs Pointer Refs", url: "lec15-sec5.html" },
          { id: "lec15-sec6", title: "Constructor Arrays", url: "lec15-sec6.html" }
        ];

        this.sceneConfig = {
          id: "lec15-sec5",
          title: "Value Duplicates vs Pointer Refs",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `
                <p>Passing arguments to functions is a key efficiency design decision in C++. Pass-by-value makes a copy of the object using its copy constructor. Pass-by-reference simply passes an alias (reference), avoiding copy overhead.</p>
                <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; border: 1px dashed rgba(255,255,255,0.2); font-size: 13px;">
                  <span style="color:#64748b;">// Pass-by-Value (Slow/Copy)</span><br>
                  void calculate(Circle c);<br><br>
                  <span style="color:#64748b;">// Pass-by-Reference (Fast/Alias)</span><br>
                  void calculate(const Circle&amp; c);
                </div>
              `
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `
                <p>Pass-by-value duplicates the entire byte array block onto the stack frame. Pass-by-reference passes a pointer (address) referencing the original segment:</p>
                <ul>
                  <li><strong>Pass by Value Stack Footprint:</strong> size of Object (e.g. $64$ bytes if instance contains large arrays).</li>
                  <li><strong>Pass by Reference Stack Footprint:</strong> $8$ bytes (representing the $64$-bit memory pointer address).</li>
                </ul>
              `
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `
                <p>Pass-by-value triggers the execution of the class copy constructor. The CPU performs copy loops transferring bytes, consuming multiple clock cycles. Pass-by-reference performs in 1 clock cycle by loading the reference address directly into register $RCX$:</p>
                <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 13px;">
                  <span style="color:#64748b;">; Pass-by-Reference compiled assembly</span><br>
                  lea rcx, [rbp - 64] &nbsp;; Load memory address of original<br>
                  call calculate &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;; Call function passing address in RCX
                </div>
              `
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `
                <p>The comparative tracks show duplication vs pointers in WebGL. The pass-by-value animation instantiates a cloned vertex buffer array and translates it. The pass-by-reference animation draws a glowing laser connector line to the original node in real time.</p>
              `
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `
                <p><strong>Misconception Shattered:</strong> Many believe references are high-level aliases that exist inside CPU structures. In compiled machine code, references do not exist.</p>
                <p>Under the hood, references are implemented as pointers (memory addresses). The compiler hides dereferencing syntax (e.g. <code>*ptr</code>) from C++ source files, but the machine instructions are identical. Thus, passing by reference is passing an 8-byte pointer.</p>
              `
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        // Tabs
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        // Action Buttons
        const btnVal = document.getElementById('action-val');
        const btnRef = document.getElementById('action-ref');
        
        if (btnVal) {
          btnVal.addEventListener('click', () => {
            this.sceneManager.generator.handleInteraction('val', null);
          });
        }
        if (btnRef) {
          btnRef.addEventListener('click', () => {
            this.sceneManager.generator.handleInteraction('ref', null);
          });
        }

        // Speed Slider
        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        // Drawer Menu Toggles
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        // Populate Index Grid
        const drawerGrid = document.getElementById('drawer-scenes-grid');
        if (drawerGrid) {
          this.scenesList.forEach(scene => {
            const card = document.createElement('a');
            card.className = 'scene-card';
            card.href = scene.url;
            card.innerHTML = `
              <div style="font-size: 11px; color: var(--color-programming); font-weight: 600;">${scene.id.toUpperCase().replace('-', ' · ')}</div>
              <div style="font-size: 14px; font-weight: 600; color: #ffffff; margin-top: 4px;">${scene.title}</div>
            `;
            drawerGrid.appendChild(card);
          });
        }

        // Set Prev/Next links
        const currentIdx = this.scenesList.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        if (currentIdx > 0) {
          prevBtn.href = this.scenesList[currentIdx - 1].url;
        } else {
          prevBtn.style.opacity = '0.5';
          prevBtn.style.pointerEvents = 'none';
        }
        
        if (currentIdx < this.scenesList.length - 1) {
          nextBtn.href = this.scenesList[currentIdx + 1].url;
        } else {
          nextBtn.style.opacity = '0.5';
          nextBtn.style.pointerEvents = 'none';
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
          if (e.key === 'r' || e.key === 'R') {
            if (slider) {
              slider.value = 1.0;
              slider.dispatchEvent(new Event('input'));
            }
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
