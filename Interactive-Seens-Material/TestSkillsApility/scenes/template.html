<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Scene Template — C++ OOP Simulator</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* WebGL Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    /* Glass Panels Layout */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all var(--duration-normal, 250ms) cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Panel */
    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .nav-btn:focus-visible {
      outline: 2px solid var(--color-programming);
      outline-offset: 2px;
    }

    /* Tabs Navigation (Bottom Center) */
    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--color-programming);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    /* Details Panel (Right Side) */
    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    /* Controls Panel (Left Side) */
    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Drawer Panel (Index / Navigation Hub Overlay) */
    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    /* Accessibility visible focus */
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .details-panel.glass-panel {
        width: 320px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>
</head>
<body>
  
  <!-- WebGL Render Target -->
  <div id="canvas-container"></div>
  
  <!-- Mobile Content Layout Wrapper (only takes layout space on mobile) -->
  <div id="mobile-layout-wrap">
    
    <!-- Floating Header -->
    <header class="glass-panel">
      <div class="header-title-section">
        <span class="header-breadcrumb">Lecture 1 · Section 1</span>
        <h1 class="header-title" id="scene-title">Procedural Execution Flow</h1>
      </div>
      <div class="header-nav">
        <a class="nav-btn" href="#" id="prev-btn">← Prev</a>
        <button class="nav-btn" id="menu-btn" aria-label="Open Navigation Hub">☰ Index</button>
        <a class="nav-btn" href="#" id="next-btn">Next →</a>
      </div>
    </header>

    <!-- Controls Panel -->
    <section class="controls-panel glass-panel" aria-label="Scene Controls">
      <h2 class="controls-title">Interactive Panel</h2>
      <div class="control-group">
        <div class="control-label">
          <span>Simulation Speed</span>
          <span id="speed-val">1.0x</span>
        </div>
        <input type="range" class="control-slider" id="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" aria-label="Adjust speed multiplier">
      </div>
    </section>

    <!-- Details Panel -->
    <main class="details-panel glass-panel" aria-label="Explanation Panel">
      <h2 class="details-title" id="panel-layer-name">THE SOFTWARE LAYER</h2>
      <div class="details-content" id="panel-dynamic-content">
        <!-- Render content here dynamically -->
      </div>
    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar glass-panel" aria-label="Visual Layers Selection">
      <button class="tab-btn active" data-tab="0" style="--layer-color: var(--layer-software)">Software</button>
      <button class="tab-btn" data-tab="1" style="--layer-color: var(--layer-ram)">RAM Map</button>
      <button class="tab-btn" data-tab="2" style="--layer-color: var(--layer-cpu)">CPU / RIP</button>
      <button class="tab-btn" data-tab="3" style="--layer-color: var(--layer-gpu)">GPU FX</button>
      <button class="tab-btn" data-tab="4" style="--layer-color: var(--layer-corrector)">Corrector</button>
    </nav>
    
  </div>

  <!-- Interactive Index Navigation Hub Drawer Overlay -->
  <div id="nav-drawer" role="dialog" aria-modal="true" aria-label="Interactive Navigation Grid">
    <div class="drawer-content glass-panel">
      <button class="drawer-close" id="drawer-close-btn" aria-label="Close index hub">×</button>
      <h2 class="header-title" style="margin-bottom: var(--space-md);">All Visual Scenes</h2>
      <div class="drawer-grid" id="drawer-scenes-grid">
        <!-- Grid dynamically loaded or static list -->
      </div>
    </div>
  </div>

  <!-- JavaScript Manager Infrastructure -->
  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {
        // Build scene-specific geometries here (Abstract)
      }

      update(delta, speed) {
        // Frame animation logic (Abstract)
      }

      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
        // Shift colors/wireframes based on selected layer
      }

      handleInteraction(controlId, value) {
        // Interaction logic (Abstract)
      }

      // Memory Disposal
      dispose() {
        this.meshes.forEach(mesh => {
          this.scene.remove(mesh);
        });
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      // Color Interpolation Helper
      smoothTransitionColor(material, targetHex, duration = 600) {
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // Easing curve (ease-in-out)
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }
    }

    // Placeholder Scene Generator subclass
    class TemplateGenerator extends BaseGenerator {
      create() {
        // Create an illustrative torus mesh
        const geo = new THREE.TorusKnotGeometry(1.5, 0.4, 120, 16);
        const mat = new THREE.MeshPhysicalMaterial({
          color: 0x3b82f6,
          metalness: 0.1,
          roughness: 0.3,
          clearcoat: 0.8,
          clearcoatRoughness: 0.2
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.scene.add(mesh);
        
        this.meshes.push(mesh);
        this.geometries.push(geo);
        this.materials.push(mat);
      }

      update(delta, speed) {
        // Gentle rotation
        const speedMultiplier = speed * 0.4;
        this.meshes.forEach(mesh => {
          mesh.rotation.y += delta * speedMultiplier;
          mesh.rotation.x += delta * speedMultiplier * 0.5;
        });
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        const mat = this.materials[0];
        
        switch (tabIndex) {
          case 0: // Software (Blue solid)
            mat.wireframe = false;
            this.smoothTransitionColor(mat, '#3b82f6');
            mat.opacity = 1.0;
            break;
          case 1: // RAM Map (Purple Wireframe)
            mat.wireframe = true;
            this.smoothTransitionColor(mat, '#a855f7');
            mat.opacity = 0.6;
            break;
          case 2: // CPU RIP (Cyan Emissive Highlights)
            mat.wireframe = false;
            this.smoothTransitionColor(mat, '#06b6d4');
            mat.opacity = 1.0;
            break;
          case 3: // GPU FX (Green Glowing Bounds)
            mat.wireframe = true;
            this.smoothTransitionColor(mat, '#22c55e');
            mat.opacity = 0.8;
            break;
          case 4: // Corrector (Crimson Alert)
            mat.wireframe = false;
            this.smoothTransitionColor(mat, '#ef4444');
            mat.opacity = 1.0;
            break;
        }
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        // Renderer
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.1;
        this.container.appendChild(this.renderer.domElement);

        // Camera
        this.camera = new THREE.PerspectiveCamera(
          45,
          this.container.clientWidth / this.container.clientHeight,
          0.1,
          100
        );
        this.camera.position.set(0, 3, 7);

        // Controls
        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1; // Limit panning under floor
        this.controls.minDistance = 2;
        this.controls.maxDistance = 25;

        // Managers
        this.lights = new LightingManager(this.scene);
        this.generator = new TemplateGenerator(this.scene);

        // Clock
        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        // Bind events
        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        // Skip Three.js updates if reduced motion is requested
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        
        // Deep disposal
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    // ----------------------------------------------------
    // LIGHTING CONFIGURATION MANAGER
    // ----------------------------------------------------
    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        // Ambient fill
        const ambient = new THREE.AmbientLight(0xffffff, 0.2);
        this.scene.add(ambient);
        this.lights.push(ambient);

        // Directional Key Light
        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(5, 8, 5);
        key.castShadow = true;
        key.shadow.mapSize.width = 1024;
        key.shadow.mapSize.height = 1024;
        key.shadow.camera.near = 0.5;
        key.shadow.camera.far = 25;
        this.scene.add(key);
        this.lights.push(key);

        // Directional Fill Light
        const fill = new THREE.DirectionalLight(0x06b6d4, 0.3); // Cyan glow
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);

        // Point Light (Rim Accent)
        const rim = new THREE.PointLight(0xa855f7, 0.6, 12); // Purple rim glow
        rim.position.set(0, 4, -3);
        this.scene.add(rim);
        this.lights.push(rim);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec1-sec1",
          title: "Procedural Execution Flow",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: "<p>A 3D vertical track (rendered as a glowing pipe geometry) representing the execution path. Instruction blocks are floating 3D glass panels aligned along the Z-axis. An interactive slider controls playback speed. A glowing progress cylinder grows down the track.</p>"
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: "<p><strong>Stack Frame:</strong> <code>process()</code> [size: 16 bytes]. Local variable <code>double area</code> occupies 8 bytes at offset -8 from Base Pointer RBP. Stack grows downwards when called and shrinks upwards when returning.</p>"
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: "<p>Program Counter (RIP) moves sequentially: <code>0x00401010</code> &rarr; <code>0x00401025</code> &rarr; <code>0x0040103E</code>. Instruction Pointer register increments sequentially by 4 bytes ($$\\Delta RIP = +4$$).</p>"
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: "<p>A custom fragment shader renders the active instruction with a glowing neon border and streams glowing line primitives to represent data flow in the GPU buffer layout.</p>"
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: "<p><strong>Misconception Shattered:</strong> In procedural programming, there are no hardware-enforced boundaries. Variables on the stack are simple memory locations. Any instruction with the correct address offset can read or write to them, as memory safety is purely a compiler-level concept.</p>"
            }
          ]
        };
      }

      init() {
        // Initialize Scene
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        // Wire event listeners
        this.initEventListeners();

        // Load Default Content
        this.switchTab(0);
        
        // Setup Close/Unload disposal
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        // Tabs
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        // Speed Slider
        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
            this.sceneManager.generator.handleInteraction('speed', val);
          });
        }

        // Index / Drawer Menu toggles
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
          if (e.key === 'r' || e.key === 'R') {
            // Reset simulation speed
            if (slider) {
              slider.value = 1.0;
              slider.dispatchEvent(new Event('input'));
            }
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        // Render equations with KaTeX
        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        // Morph the 3D meshes to reflect the active layer style
        this.sceneManager.generator.transitionLayer(tabIdx);
      }
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
</html>
