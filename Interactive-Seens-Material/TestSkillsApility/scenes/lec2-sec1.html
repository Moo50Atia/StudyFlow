<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 2 Sec 1 — Decentralized Object Networks</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    .details-content code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      color: #e2e8f0;
    }

    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .interactive-btn {
      background: var(--color-learning);
      border: none;
      color: white;
      padding: 10px 12px;
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 150ms ease;
      text-align: center;
    }

    .interactive-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>

<body>

  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {}
      update(delta, speed) {}
      
      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }

      handleInteraction(controlId, value) {}

      dispose() {
        this.meshes.forEach(mesh => this.scene.remove(mesh));
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }

      createTextTexture(text, bgColor = 'rgba(0,0,0,0)', textColor = '#ffffff', fontSize = 32) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bgColor !== 'rgba(0,0,0,0)') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.font = `bold ${fontSize}px 'Inter', sans-serif`;
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
      }
    }

    // ----------------------------------------------------
    // LEC 2 SEC 1 GENERATOR (DECENTRALIZED NETWORK)
    // ----------------------------------------------------
    class DecentralizedNetworkGenerator extends BaseGenerator {
      constructor(scene) {
        super(scene);
        this.time = 0;
        this.objects = [];
        this.pulses = [];
        this.networkLines = [];
      }

      create() {
        // Positions for 3 objects in space
        const positions = [
          new THREE.Vector3(-2.2, 0.6, 0),  // obj1
          new THREE.Vector3(2.2, 0.6, 0),   // obj2
          new THREE.Vector3(0, -1.8, 0)     // obj3
        ];
        const names = ["obj1 (0x01A0)", "obj2 (0x01B8)", "obj3 (0x01D0)"];
        const colors = [0x3b82f6, 0xa855f7, 0x22c55e];

        positions.forEach((pos, idx) => {
          // Inner core (data fields mesh)
          const coreGeo = new THREE.IcosahedronGeometry(0.4, 1);
          const coreMat = new THREE.MeshBasicMaterial({
            color: colors[idx],
            wireframe: true
          });
          const coreMesh = new THREE.Mesh(coreGeo, coreMat);
          coreMesh.position.copy(pos);
          this.scene.add(coreMesh);
          this.meshes.push(coreMesh);
          this.geometries.push(coreGeo);
          this.materials.push(coreMat);

          // Outer semi-transparent shell (the object boundary)
          const shellGeo = new THREE.SphereGeometry(0.7, 32, 32);
          const shellMat = new THREE.MeshPhysicalMaterial({
            color: colors[idx],
            transparent: true,
            opacity: 0.3,
            transmission: 0.6,
            roughness: 0.1,
            metalness: 0.1,
            clearcoat: 1.0
          });
          const shellMesh = new THREE.Mesh(shellGeo, shellMat);
          shellMesh.position.copy(pos);
          this.scene.add(shellMesh);
          this.meshes.push(shellMesh);
          this.geometries.push(shellGeo);
          this.materials.push(shellMat);

          // Outer logic ring (rotating)
          const ringGeo = new THREE.TorusGeometry(0.95, 0.04, 8, 48);
          const ringMat = new THREE.MeshBasicMaterial({ color: colors[idx] });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.position.copy(pos);
          ringMesh.rotation.x = Math.PI / 2;
          this.scene.add(ringMesh);
          this.meshes.push(ringMesh);
          this.geometries.push(ringGeo);
          this.materials.push(ringMat);

          // Label
          const labelTex = this.createTextTexture(names[idx], 'rgba(15,18,30,0.8)', '#ffffff', 32);
          const labelGeo = new THREE.PlaneGeometry(1.6, 0.45);
          const labelMat = new THREE.MeshBasicMaterial({
            map: labelTex,
            transparent: true,
            side: THREE.DoubleSide
          });
          const labelMesh = new THREE.Mesh(labelGeo, labelMat);
          labelMesh.position.copy(pos).add(new THREE.Vector3(0, 1.2, 0));
          this.scene.add(labelMesh);
          this.meshes.push(labelMesh);
          this.geometries.push(labelGeo);
          this.materials.push(labelMat);

          this.objects.push({
            pos: pos,
            core: coreMesh,
            shell: shellMesh,
            ring: ringMesh,
            label: labelMesh
          });
        });

        // Add communication lines forming a triangle network
        const pairs = [
          [0, 1],
          [1, 2],
          [2, 0]
        ];

        pairs.forEach(pair => {
          const p1 = this.objects[pair[0]].pos;
          const p2 = this.objects[pair[1]].pos;
          const points = [p1, p2];
          const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
          const lineMat = new THREE.LineBasicMaterial({
            color: 0x475569,
            transparent: true,
            opacity: 0.6
          });
          const line = new THREE.Line(lineGeo, lineMat);
          this.scene.add(line);
          this.meshes.push(line);
          this.geometries.push(lineGeo);
          this.materials.push(lineMat);
          this.networkLines.push(line);
        });

        // Add dynamic instruction pointer (CPU tab)
        const ptrGeo = new THREE.ConeGeometry(0.12, 0.35, 4);
        const ptrMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
        this.cpuPtr = new THREE.Mesh(ptrGeo, ptrMat);
        this.cpuPtr.position.set(-2.2, 2.2, 0);
        this.cpuPtr.visible = false;
        this.scene.add(this.cpuPtr);
        this.meshes.push(this.cpuPtr);
        this.geometries.push(ptrGeo);
        this.materials.push(ptrMat);
      }

      update(delta, speed) {
        this.time += delta * speed;

        // Animate elements of the objects
        this.objects.forEach((obj, idx) => {
          // Spin core
          obj.core.rotation.y += delta * 0.5;
          obj.core.rotation.x += delta * 0.25;

          // Rotate public ring
          obj.ring.rotation.z += delta * 0.6 * (idx % 2 === 0 ? 1 : -1);

          // Bounce shells gently
          const bounce = Math.sin(this.time * 1.5 + idx) * 0.05;
          obj.shell.position.y = obj.pos.y + bounce;
          obj.core.position.y = obj.pos.y + bounce;
          obj.ring.position.y = obj.pos.y + bounce;
        });

        // Move active signal pulses
        for (let i = this.pulses.length - 1; i >= 0; i--) {
          const p = this.pulses[i];
          p.age += delta * speed;
          const t = Math.min(p.age / p.lifetime, 1);
          p.mesh.position.lerpVectors(p.start, p.end, t);

          if (t >= 1) {
            this.scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            this.pulses.splice(i, 1);

            // trigger receptor highlight
            this.triggerHighlight(p.targetIdx);
          }
        }
      }

      triggerHighlight(idx) {
        const shellMat = this.objects[idx].shell.material;
        const baseColor = shellMat.color.clone();
        shellMat.color.setHex(0xffffff);
        shellMat.opacity = 0.8;
        setTimeout(() => {
          shellMat.color.copy(baseColor);
          shellMat.opacity = 0.3;
        }, 200);
      }

      spawnPulse(fromIdx, toIdx) {
        const start = this.objects[fromIdx].pos;
        const end = this.objects[toIdx].pos;

        const pulseGeo = new THREE.SphereGeometry(0.12, 12, 12);
        const pulseMat = new THREE.MeshBasicMaterial({
          color: 0xeab308,
          transparent: true,
          opacity: 0.9
        });
        const mesh = new THREE.Mesh(pulseGeo, pulseMat);
        mesh.position.copy(start);
        this.scene.add(mesh);

        this.pulses.push({
          mesh: mesh,
          start: start,
          end: end,
          age: 0,
          lifetime: 0.8 / window.app.speedMultiplier,
          targetIdx: toIdx
        });
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);

        this.cpuPtr.visible = false;
        
        // reset object material styles
        this.objects.forEach((obj, idx) => {
          obj.shell.material.wireframe = false;
          obj.shell.material.opacity = 0.3;
          obj.core.material.wireframe = true;
          obj.ring.visible = true;
        });
        this.networkLines.forEach(l => l.material.color.setHex(0x475569));

        switch (tabIndex) {
          case 0: // Software (Blue core theme)
            break;

          case 1: // RAM Map (Purple wireframe)
            this.objects.forEach(obj => {
              obj.shell.material.wireframe = true;
              obj.shell.material.opacity = 0.15;
            });
            break;

          case 2: // CPU / RIP (Pointer highlighted)
            this.cpuPtr.visible = true;
            this.cpuPtr.position.copy(this.objects[0].pos).add(new THREE.Vector3(0, 1.8, 0));
            break;

          case 3: // GPU FX (Neon layout)
            this.networkLines.forEach(l => l.material.color.setHex(0x22c55e));
            break;

          case 4: // Corrector (Alert state crimson)
            this.objects.forEach(obj => {
              obj.shell.material.wireframe = false;
              obj.shell.material.opacity = 0.4;
            });
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'msg12') {
          this.spawnPulse(0, 1);
          if (this.activeLayer === 2) {
            this.cpuPtr.position.copy(this.objects[1].pos).add(new THREE.Vector3(0, 1.8, 0));
          }
        } else if (controlId === 'msg23') {
          this.spawnPulse(1, 2);
          if (this.activeLayer === 2) {
            this.cpuPtr.position.copy(this.objects[2].pos).add(new THREE.Vector3(0, 1.8, 0));
          }
        }
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(
          45,
          this.container.clientWidth / this.container.clientHeight,
          0.1,
          100
        );
        this.camera.position.set(0, 0, 8);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1;

        this.lights = new LightingManager(this.scene);
        this.generator = new DecentralizedNetworkGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.85);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0x06b6d4, 0.35);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec2-sec1",
          title: "Decentralized Object Networks",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `
                <p>Unlike procedural models, OOP structures execution as a network of autonomous entities (objects) that communicate via message passing.</p>
                <p>3D floating spheres contain private state mesh cores and are surrounded by rotating public interface rings. Triggering messages initiates visual pulse bursts traversing between objects.</p>
              `
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `
                <p>Variables reside inside individual blocks scattered across the <strong>Heap Segment</strong>. References to these blocks live on the Stack:</p>
                <ul>
                  <li><code>obj1</code> heap block: <code>0x01A0</code></li>
                  <li><code>obj2</code> heap block: <code>0x01B8</code></li>
                  <li><code>obj3</code> heap block: <code>0x01D0</code></li>
                </ul>
                <p>Stack frames contain temporary local reference pointers addressing these heap spaces.</p>
              `
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `
                <p>When a method is called on an object, the Instruction Pointer ($RIP$) jumps to the code segment location where the method instructions sit.</p>
                <p>The compiler passes the address of the target object heap block as an implicit parameter via the register <code>RCX</code> (known as the <strong>this pointer</strong>):</p>
                $$RIP = \\text{Method Address}$$
                $$RCX = \\text{Heap Address (this pointer)}$$
              `
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `
                <p>The communication channels are mapped in VRAM as glowing lines. Pulses are drawn as high-performance particle paths animated along vectors in real time.</p>
              `
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `
                <div style="border-left: 4px solid var(--color-danger); padding-left: 10px; background: rgba(239, 68, 68, 0.08); padding-top: 8px; padding-bottom: 8px; border-radius: 4px;">
                  <strong style="color:var(--color-danger)">Misconception Shattered:</strong>
                  <p>Students often visualize OOP execution as a linear run inside the class file. In raw hardware, there is no "class execution loop". Execution jumps constantly between instruction locations in the text segment, mapping variables dynamically via base register offsets.</p>
                </div>
              `
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.initDrawerGrid();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        document.getElementById('msg-btn').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('msg12');
        });

        document.getElementById('msg-btn2').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('msg23');
        });

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      initDrawerGrid() {
        const grid = document.getElementById('drawer-scenes-grid');
        const items = [
          { name: "Procedural Execution Flow", path: "lec1-sec1.html", lec: "Lec 1 · Sec 1" },
          { name: "Shared Global Scope", path: "lec1-sec2.html", lec: "Lec 1 · Sec 2" },
          { name: "Decentralized Object Networks", path: "lec2-sec1.html", lec: "Lec 2 · Sec 1" },
          { name: "Object Identity & State", path: "lec2-sec2.html", lec: "Lec 2 · Sec 2" },
          { name: "Encapsulation Barriers", path: "lec2-sec3.html", lec: "Lec 2 · Sec 3" },
          { name: "State & Representation", path: "lec3-sec1.html", lec: "Lec 3 · Sec 1" },
          { name: "Object Behavior & Methods", path: "lec3-sec2.html", lec: "Lec 3 · Sec 2" },
          { name: "Class Blueprint vs. Instances", path: "lec3-sec3.html", lec: "Lec 3 · Sec 3" }
        ];

        grid.innerHTML = items.map(item => `
          <a class="scene-card" href="${item.path}">
            <div style="font-size: 12px; color: #94a3b8;">${item.lec}</div>
            <div style="font-weight: 600; color: #fff;">${item.name}</div>
          </a>
        `).join('');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
