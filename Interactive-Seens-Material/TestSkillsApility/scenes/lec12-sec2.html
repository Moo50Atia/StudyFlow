    .drawer-close {

    .scene-card {

    button:focus-visible, input:focus-visible, a:focus-visible {

    @media (max-width: 768px) {

<body>

  <script>
    const allScenes = [
      { id: "lec11-sec1", title: "Abstraction Covers", path: "lec11-sec1.html" },
      { id: "lec11-sec2", title: "Encapsulation Safety Lock", path: "lec11-sec2.html" },
      { id: "lec12-sec1", title: "Stability Tower Collapse", path: "lec12-sec1.html" },
      { id: "lec12-sec2", title: "Tight Coupling Snaps", path: "lec12-sec2.html" },
      { id: "lec13-sec1", title: "Getter/Setter Bridge Channels", path: "lec13-sec1.html" },
      { id: "lec13-sec2", title: "The Const Read-Only Filter", path: "lec13-sec2.html" },
      { id: "lec13-sec3", title: "Setter Boundary Validation", path: "lec13-sec3.html" }
    ];

    // ----------------------------------------------------
    // SCENE GENERATOR SUBCLASS: Tight Coupling Snaps
    // ----------------------------------------------------
    class CouplingGenerator extends BaseGenerator {
      create() {
        // Base parent container layout (Central class memory representation)
        this.parentGroup = new THREE.Group();
        this.scene.add(this.parentGroup);
        this.meshes.push(this.parentGroup);

        // Cylinder segments (representing variable locations)
        const segGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.6, 32);
        
        this.segments = [];
        this.segmentOffsets = [0.8, 0, -0.8]; // Y coordinates
        const colors = [0x06b6d4, 0xa855f7, 0x3b82f6];

        for (let i = 0; i < 3; i++) {
          const segMat = new THREE.MeshPhysicalMaterial({
            color: colors[i],
            roughness: 0.1,
            metalness: 0.8,
            transmission: 0.4,
            thickness: 1.0
          });
          const seg = new THREE.Mesh(segGeo, segMat);
          seg.position.y = this.segmentOffsets[i];
          this.parentGroup.add(seg);
          this.segments.push(seg);
          this.materials.push(segMat);
        }
        this.geometries.push(segGeo);

        // Satellite clients (Dependent applications)
        this.clients = [];
        const clientGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const positions = [
          new THREE.Vector3(-3.5, 1.2, 0),
          new THREE.Vector3(3.5, 0, -1),
          new THREE.Vector3(-2, -1.2, 3)
        ];

        for (let i = 0; i < 3; i++) {
          const clientMat = new THREE.MeshPhysicalMaterial({
            color: 0x22c55e, // Green (Good status)
            roughness: 0.3,
            metalness: 0.5
          });
          const client = new THREE.Mesh(clientGeo, clientMat);
          client.position.copy(positions[i]);
          this.scene.add(client);
          this.clients.push(client);
          this.materials.push(clientMat);
        }
        this.geometries.push(clientGeo);

        // Glowing connection lines (cables)
        this.lines = [];
        this.lineMaterials = [];
        
        for (let i = 0; i < 3; i++) {
          const lineMat = new THREE.LineBasicMaterial({
            color: 0x06b6d4,
            linewidth: 3 // Note: standard WebGL ignores linewidth, but color is visible
          });
          const points = [
            positions[i],
            new THREE.Vector3(0, this.segmentOffsets[i], 0)
          ];
          const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
          const line = new THREE.Line(lineGeo, lineMat);
          this.scene.add(line);
          this.lines.push(line);
          this.lineMaterials.push(lineMat);
          this.geometries.push(lineGeo);
        }

        this.shiftOffset = false;
        this.glitchTimer = 0;
      }

      update(delta, speed) {
        this.parentGroup.rotation.y += delta * 0.2 * speed;
        this.clients.forEach((c, idx) => {
          c.rotation.x += delta * 0.3 * speed;
          c.rotation.y += delta * 0.1 * speed;
        });

        // Shift calculations
        if (this.shiftOffset) {
          // Slide middle segment out of alignment, showing offset shift
          this.segments[1].position.x += (1.5 - this.segments[1].position.x) * 0.08 * speed;
          this.segments[1].position.y += (-0.4 - this.segments[1].position.y) * 0.08 * speed;

          this.glitchTimer += delta * 5 * speed;

          // Snap connection cables and turn clients red/corrupted
          this.clients.forEach((client, idx) => {
            this.smoothTransitionColor(client.material, 0xef4444, 150); // Red alert
            
            // Re-render lines as broken lines or shake them
            const points = [
              client.position.clone(),
              // Displaced target
              new THREE.Vector3(
                (Math.random() - 0.5) * 0.2, 
                this.segmentOffsets[idx] + (idx === 1 ? -0.4 : 0), 
                0
              )
            ];
            
            this.lines[idx].geometry.setFromPoints(points);
            this.lineMaterials[idx].color.setHex(0xef4444); // Red snapped cable
          });
        } else {
          // Reset alignment
          this.segments[1].position.x += (0 - this.segments[1].position.x) * 0.08 * speed;
          this.segments[1].position.y += (0 - this.segments[1].position.y) * 0.08 * speed;

          this.clients.forEach((client, idx) => {
            this.smoothTransitionColor(client.material, 0x22c55e, 300); // Back to green
            
            const p = client.position.clone();
            const segWorld = new THREE.Vector3(0, this.segmentOffsets[idx], 0);
            this.lines[idx].geometry.setFromPoints([p, segWorld]);
            this.lineMaterials[idx].color.setHex(0x06b6d4); // Cyan connected cable
          });
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        this.segments.forEach(seg => seg.material.wireframe = false);
        this.clients.forEach(cli => cli.material.wireframe = false);

        switch (tabIndex) {
          case 0:
            this.smoothTransitionColor(this.segments[0].material, 0x06b6d4);
            break;
          case 1: // RAM (Purple Wireframe)
            this.segments.forEach(seg => {
              seg.material.wireframe = true;
              this.smoothTransitionColor(seg.material, 0xa855f7);
            });
            this.clients.forEach(cli => {
              cli.material.wireframe = true;
              this.smoothTransitionColor(cli.material, 0xa855f7);
            });
            break;
          case 2: // CPU
            this.segments.forEach(seg => this.smoothTransitionColor(seg.material, 0x06b6d4));
            break;
          case 3: // GPU FX
            this.segments.forEach(seg => {
              seg.material.wireframe = true;
              this.smoothTransitionColor(seg.material, 0x22c55e);
            });
            break;
          case 4: // Corrector (Red)
            this.segments.forEach(seg => this.smoothTransitionColor(seg.material, 0xef4444));
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'shift') {
          this.shiftOffset = value;
        }
      }
    }

    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 3, 9);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;

        this.lights = new LightingManager(this.scene);
        this.generator = new CouplingGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.95);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0x06b6d4, 0.45);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec12-sec2",
          title: "Tight Coupling Snaps",
          breadcrumb: "Lecture 12 · Section 2",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `<p>Exposing implementation details creates tight coupling. When external clients access variables directly, any change to the internal layout (like changing variable order or size) shifts memory offsets, breaking client compiled assumptions.</p>
                        <p>Toggle <strong>Shift Memory Offset</strong> to see what happens when the class's data layout changes. The connection links snap, and clients show "CRASH", representing structural binary incompatibility.</p>`
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `<p><strong>Binary Interface Breakage:</strong> In the old layout, client reads value at offset $+8$. Modifying the base class structure (e.g., adding an integer before the variable) shifts the offset to $+16$.</p>
                        <p>$$\\text{Old Offset} = +8, \\quad \\text{New Offset} = +16$$</p>
                        <p>Precompiled client applications continue reading memory at offset $+8$, loading garbage bits instead of the expected value: $$\\text{RAM}[\\text{Base}+8] \\neq \\text{RAM}[\\text{Base}+16]$$.</p>`
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `<p>The CPU executes instructions using hardcoded compiler offsets. It loads data from the wrong memory cell into registers, causing math calculations to produce corrupt values or throwing a segment fault (<code>SIGSEGV</code>) if reading past boundaries:</p>
                        <p>$$RAX \\leftarrow [\\text{RCX} + 8] \\quad \\text{(reads garbage)}$$</p>`
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `<p>3D lines represent compilation links between the Central class node and Satellite client meshes. Activating memory shift animates the central node segments sliding apart, stretching and snapping the cables, accompanied by a static glitch shader effect on the clients.</p>`
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `<p><strong>Misconception Shattered:</strong> Data hiding is not just about keeping fields "secret." It is a fundamental maintainability rule. If class data is private and accessed only through getter/setter methods, you can change the internal data layout completely. As long as the method interfaces remain unchanged, compiled client binaries will not break.</p>`
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.buildNavigationHub();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.switchTab(parseInt(btn.dataset.tab));
          });
        });

        const offsetCb = document.getElementById('shift-offset-cb');
        if (offsetCb) {
          offsetCb.addEventListener('change', (e) => {
            this.sceneManager.generator.handleInteraction('shift', e.target.checked);
          });
        }

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        const currentIdx = allScenes.findIndex(s => s.id === this.sceneConfig.id);
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        if (currentIdx > 0) {
          prevBtn.href = allScenes[currentIdx - 1].path;
        } else {
          prevBtn.style.opacity = 0.5;
          prevBtn.style.pointerEvents = 'none';
        }

        if (currentIdx < allScenes.length - 1) {
          nextBtn.href = allScenes[currentIdx + 1].path;
        } else {
          nextBtn.style.opacity = 0.5;
          nextBtn.style.pointerEvents = 'none';
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const btn = document.querySelector(`.tab-btn[data-tab="${parseInt(e.key) - 1}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      buildNavigationHub() {
        const grid = document.getElementById('drawer-scenes-grid');
        grid.innerHTML = '';
        allScenes.forEach(scene => {
          const card = document.createElement('a');
          card.className = `scene-card ${scene.id === this.sceneConfig.id ? 'active' : ''}`;
          card.href = scene.path;
          card.innerHTML = `
            <div class="card-meta">${scene.id.toUpperCase()}</div>
            <div style="font-weight:600;color:#fff;margin-top:4px;">${scene.title}</div>
          `;
          grid.appendChild(card);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
</body>
</html>
