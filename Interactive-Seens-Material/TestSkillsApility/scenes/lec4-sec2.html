<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Symbols & Shared Platform — C++ OOP Simulator</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* WebGL Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    /* Glass Panels Layout */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Panel */
    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .nav-btn:focus-visible {
      outline: 2px solid var(--color-programming);
      outline-offset: 2px;
    }

    /* Tabs Navigation (Bottom Center) */
    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--color-programming);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    /* Details Panel (Right Side) */
    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    .details-content code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      color: var(--color-programming);
    }

    /* Controls Panel (Left Side) */
    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Drawer Panel (Index / Navigation Hub Overlay) */
    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    /* Accessibility visible focus */
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-programming) !important;
      outline-offset: 2px;
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .details-panel.glass-panel {
        width: 320px;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>
</head>
<body>
  
  <!-- WebGL Render Target -->
  <div id="canvas-container"></div>
  
  <!-- Mobile Content Layout Wrapper (only takes layout space on mobile) -->
  <div id="mobile-layout-wrap">
    
    <!-- Floating Header -->
    <header class="glass-panel">
      <div class="header-title-section">
        <span class="header-breadcrumb">Lecture 4 · Section 2</span>
        <h1 class="header-title" id="scene-title">Access Symbols & Shared Platform</h1>
      </div>
      <div class="header-nav">
        <a class="nav-btn" href="lec4-sec1.html" id="prev-btn">← Prev</a>
        <button class="nav-btn" id="menu-btn" aria-label="Open Navigation Hub">☰ Index</button>
        <a class="nav-btn" href="lec5-sec1.html" id="next-btn">Next →</a>
      </div>
    </header>

    <!-- Controls Panel -->
    <section class="controls-panel glass-panel" aria-label="Scene Controls">
      <h2 class="controls-title">Interactive Panel</h2>
      <div class="control-group">
        <div class="control-label">
          <span>Access Gate Specifier</span>
        </div>
        <div style="display: flex; gap: 8px; width: 100%;">
          <button class="nav-btn" id="btn-public" style="flex: 1; border-color: var(--color-success); background: rgba(34, 197, 94, 0.12);">Public (+)</button>
          <button class="nav-btn" id="btn-private" style="flex: 1; border-color: var(--color-danger);">Private (-)</button>
        </div>
      </div>
      <div class="control-group">
        <div class="control-label">
          <span>Simulation Speed</span>
          <span id="speed-val">1.0x</span>
        </div>
        <input type="range" class="control-slider" id="speed-slider" min="0.1" max="2.0" step="0.1" value="1.0" aria-label="Adjust speed multiplier">
      </div>
    </section>

    <!-- Details Panel -->
    <main class="details-panel glass-panel" aria-label="Explanation Panel">
      <h2 class="details-title" id="panel-layer-name">THE SOFTWARE LAYER</h2>
      <div class="details-content" id="panel-dynamic-content">
        <!-- Render content here dynamically -->
      </div>
    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar glass-panel" aria-label="Visual Layers Selection">
      <button class="tab-btn active" data-tab="0" style="--layer-color: var(--color-learning)">Software</button>
      <button class="tab-btn" data-tab="1" style="--layer-color: var(--color-creative)">RAM Map</button>
      <button class="tab-btn" data-tab="2" style="--layer-color: var(--color-programming)">CPU / RIP</button>
      <button class="tab-btn" data-tab="3" style="--layer-color: var(--color-success)">GPU FX</button>
      <button class="tab-btn" data-tab="4" style="--layer-color: var(--color-danger)">Corrector</button>
    </nav>
    
  </div>

  <!-- Interactive Index Navigation Hub Drawer Overlay -->
  <div id="nav-drawer" role="dialog" aria-modal="true" aria-label="Interactive Navigation Grid">
    <div class="drawer-content glass-panel">
      <button class="drawer-close" id="drawer-close-btn" aria-label="Close index hub">×</button>
      <h2 class="header-title" style="margin-bottom: var(--space-md);">All Visual Scenes</h2>
      <div class="drawer-grid" id="drawer-scenes-grid">
        <!-- Grid dynamically loaded -->
      </div>
    </div>
  </div>

  <!-- JavaScript Manager Infrastructure -->
  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {}
      update(delta, speed) {}
      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }
      handleInteraction(controlId, value) {}

      dispose() {
        this.meshes.forEach(mesh => {
          this.scene.remove(mesh);
        });
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }
    }

    // ----------------------------------------------------
    // CUSTOM SCENE GENERATOR SUBCLASS
    // ----------------------------------------------------
    class TemplateGenerator extends BaseGenerator {
      constructor(scene) {
        super(scene);
        this.accessPublic = true;
        this.particles = [];
        this.group = new THREE.Group();
      }

      create() {
        this.scene.add(this.group);
        this.meshes.push(this.group);

        // Create Shared Static Platform at the bottom
        const platGeo = new THREE.BoxGeometry(4.0, 0.4, 1.5);
        const platMat = new THREE.MeshPhysicalMaterial({
          color: 0xf59e0b, // Amber / Yellow
          roughness: 0.1,
          metalness: 0.6,
          clearcoat: 0.8
        });
        this.platform = new THREE.Mesh(platGeo, platMat);
        this.platform.position.y = -1.2;
        this.group.add(this.platform);
        this.materials.push(platMat);
        this.geometries.push(platGeo);

        // Label for static platform
        const platLabelGeo = new THREE.PlaneGeometry(1.8, 0.3);
        const platLabelTex = this.createCanvasLabel('Static Segment', '#f59e0b');
        const platLabelMat = new THREE.MeshBasicMaterial({ map: platLabelTex, transparent: true });
        const platLabel = new THREE.Mesh(platLabelGeo, platLabelMat);
        platLabel.position.set(0, -1.2, 0.76);
        this.group.add(platLabel);
        this.materials.push(platLabelMat);
        this.geometries.push(platLabelGeo);

        // Instance 1 (Left)
        const i1Geo = new THREE.BoxGeometry(1.0, 0.8, 1.0);
        const i1Mat = new THREE.MeshPhysicalMaterial({
          color: 0x3b82f6,
          roughness: 0.3,
          clearcoat: 0.5
        });
        this.instance1 = new THREE.Mesh(i1Geo, i1Mat);
        this.instance1.position.set(-1.4, 0.8, 0);
        this.group.add(this.instance1);
        this.materials.push(i1Mat);
        this.geometries.push(i1Geo);

        // Instance 1 Label
        const i1LabelGeo = new THREE.PlaneGeometry(0.8, 0.25);
        const i1LabelTex = this.createCanvasLabel('obj1 (0x01A0)', '#3b82f6');
        const i1LabelMat = new THREE.MeshBasicMaterial({ map: i1LabelTex, transparent: true });
        const i1Label = new THREE.Mesh(i1LabelGeo, i1LabelMat);
        i1Label.position.set(-1.4, 0.8, 0.51);
        this.group.add(i1Label);
        this.materials.push(i1LabelMat);
        this.geometries.push(i1LabelGeo);

        // Instance 2 (Right)
        const i2Geo = new THREE.BoxGeometry(1.0, 0.8, 1.0);
        const i2Mat = new THREE.MeshPhysicalMaterial({
          color: 0xa855f7,
          roughness: 0.3,
          clearcoat: 0.5
        });
        this.instance2 = new THREE.Mesh(i2Geo, i2Mat);
        this.instance2.position.set(1.4, 0.8, 0);
        this.group.add(this.instance2);
        this.materials.push(i2Mat);
        this.geometries.push(i2Geo);

        // Instance 2 Label
        const i2LabelGeo = new THREE.PlaneGeometry(0.8, 0.25);
        const i2LabelTex = this.createCanvasLabel('obj2 (0x01C0)', '#a855f7');
        const i2LabelMat = new THREE.MeshBasicMaterial({ map: i2LabelTex, transparent: true });
        const i2Label = new THREE.Mesh(i2LabelGeo, i2LabelMat);
        i2Label.position.set(1.4, 0.8, 0.51);
        this.group.add(i2Label);
        this.materials.push(i2LabelMat);
        this.geometries.push(i2LabelGeo);

        // Access Gate (a bar / barrier plane)
        const gateGeo = new THREE.BoxGeometry(3.6, 0.15, 1.2);
        this.gateMat = new THREE.MeshPhysicalMaterial({
          color: 0x22c55e,
          transparent: true,
          opacity: 0.35,
          roughness: 0.1,
          metalness: 0.5
        });
        this.gate = new THREE.Mesh(gateGeo, this.gateMat);
        this.gate.position.y = -0.2;
        this.group.add(this.gate);
        this.materials.push(this.gateMat);
        this.geometries.push(gateGeo);

        // Particle vectors flowing down to the platform
        const particleGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.geometries.push(particleGeo);
        this.materials.push(particleMat);

        for (let i = 0; i < 6; i++) {
          const p = new THREE.Mesh(particleGeo, particleMat);
          this.resetParticle(p, i);
          this.group.add(p);
          this.particles.push(p);
        }
      }

      resetParticle(p, index) {
        // Alt instances
        const sourceX = (index % 2 === 0) ? -1.4 : 1.4;
        p.position.set(sourceX, 0.4, 0);
        // Stagger startup positions
        p.position.y -= (index / 6) * 1.5;
        p.userData = {
          sourceX: sourceX,
          speed: 0.8 + Math.random() * 0.4,
          active: true
        };
      }

      createCanvasLabel(text, textColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(15, 18, 30, 0.8)';
        ctx.fillRect(0, 0, 256, 64);
        ctx.strokeStyle = textColor;
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, 252, 60);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 32);

        const tex = new THREE.CanvasTexture(canvas);
        return tex;
      }

      update(delta, speed) {
        // Spin the group slightly
        this.group.rotation.y = Math.sin(performance.now() * 0.0004) * 0.3;

        // Move access gate to targets
        const targetGateY = this.accessPublic ? -0.7 : -0.1;
        this.gate.position.y += (targetGateY - this.gate.position.y) * 0.15;

        // Animate particles flowing downwards
        this.particles.forEach((p, idx) => {
          if (!p.userData.active) return;
          
          p.position.y -= delta * p.userData.speed * speed;

          // Interpolate X towards the center as they approach the platform
          const progress = (0.4 - p.position.y) / 1.6;
          p.position.x = THREE.MathUtils.lerp(p.userData.sourceX, 0, Math.min(progress, 1));

          // Access collision check
          if (!this.accessPublic && p.position.y < this.gate.position.y + 0.1 && p.position.y > this.gate.position.y - 0.1) {
            // Hit the closed private gate: flash red and bounce/reset
            this.resetParticle(p, idx);
          }

          if (p.position.y <= -1.0) {
            // Reached platform
            this.resetParticle(p, idx);
          }
        });
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        
        // RAM and GPU FX layers activate wireframe
        this.platform.material.wireframe = (tabIndex === 1 || tabIndex === 3);
        this.instance1.material.wireframe = (tabIndex === 1 || tabIndex === 3);
        this.instance2.material.wireframe = (tabIndex === 1 || tabIndex === 3);
        
        // Emissive effects
        if (tabIndex === 3) {
          this.platform.material.emissive = new THREE.Color(0.2, 0.1, 0);
          this.instance1.material.emissive = new THREE.Color(0, 0.1, 0.2);
          this.instance2.material.emissive = new THREE.Color(0.1, 0, 0.2);
        } else {
          this.platform.material.emissive = new THREE.Color(0, 0, 0);
          this.instance1.material.emissive = new THREE.Color(0, 0, 0);
          this.instance2.material.emissive = new THREE.Color(0, 0, 0);
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'access') {
          this.accessPublic = value;
          if (value) {
            this.smoothTransitionColor(this.gateMat, '#22c55e'); // Green
            this.gateMat.opacity = 0.2;
          } else {
            this.smoothTransitionColor(this.gateMat, '#ef4444'); // Red
            this.gateMat.opacity = 0.5;
          }
        }
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.1;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 100);
        this.camera.position.set(0, 1.2, 5.5);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1;
        this.controls.minDistance = 2;
        this.controls.maxDistance = 15;

        this.lights = new LightingManager(this.scene);
        this.generator = new TemplateGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    // ----------------------------------------------------
    // LIGHTING CONFIGURATION MANAGER
    // ----------------------------------------------------
    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0xa855f7, 0.2);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec4-sec2",
          title: "Access Symbols & Shared Platform",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: "<p>A 3D scene containing access gates. Plus ('+') opens a public gateway; minus ('-') raises a private defensive wall. The underlined items map to a static platform accessed by all object meshes. Try switching access levels to see how the gate responds.</p>"
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: "<p><strong>Global/Static Segment vs Stack/Heap:</strong> The static variable is stored at a fixed, shared memory address (e.g. <code>0x004C5000</code>). When individual object instances are allocated on the Stack or Heap (e.g., <code>obj1</code> at <code>0x01A0</code>, <code>obj2</code> at <code>0x01C0</code>), they do not allocate space for the static member. They share the same global segment cell.</p>"
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: "<p>Access to a static member generates direct addressing assembly instructions (e.g., <code>mov eax, [0x004C5000]</code>). This bypasses the base pointer register offset (such as <code>[RCX + offset]</code>) used for instance members, meaning no <code>this</code> pointer dereferencing is required to read/write static variables.</p>"
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: "<p>A shared static platform (a glowing golden 3D slab) sits at the bottom, connected to two individual object instance meshes (cubes) above it. Glowing vector lines stream data packets from the object instances directly to the static platform to represent access to shared global memory.</p>"
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: "<p><strong>Misconception Shattered:</strong> Underlining a member variable or function in UML is not a decoration. It is a functional directive indicating that the member is <strong>static</strong>, meaning it does not reside inside individual object instances in memory. Only a single copy exists globally in the static data segment.</p>"
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.populateScenesGrid();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.switchTab(parseInt(btn.dataset.tab));
          });
        });

        // Speed Slider
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (speedSlider) {
          speedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        // Access Gate Buttons
        const btnPublic = document.getElementById('btn-public');
        const btnPrivate = document.getElementById('btn-private');
        
        if (btnPublic && btnPrivate) {
          btnPublic.addEventListener('click', () => {
            btnPublic.style.background = 'rgba(34, 197, 94, 0.12)';
            btnPrivate.style.background = 'transparent';
            this.sceneManager.generator.handleInteraction('access', true);
          });
          btnPrivate.addEventListener('click', () => {
            btnPrivate.style.background = 'rgba(239, 68, 68, 0.12)';
            btnPublic.style.background = 'transparent';
            this.sceneManager.generator.handleInteraction('access', false);
          });
        }

        // Drawer
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');
        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const btn = document.querySelector(`.tab-btn[data-tab="${parseInt(e.key) - 1}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      populateScenesGrid() {
        const grid = document.getElementById('drawer-scenes-grid');
        const scenes = [
          { name: "Return to Main Dashboard", url: "index.html", fullWidth: true },
          { name: "Lec 3 · Sec 3: Conveyor Belt Spawns", url: "lec3-sec3.html" },
          { name: "Lec 4 · Sec 1: UML Tiers", url: "lec4-sec1.html" },
          { name: "Lec 4 · Sec 2: Access & Statics", url: "lec4-sec2.html" },
          { name: "Lec 5 · Sec 1: Terminating Semicolon", url: "lec5-sec1.html" },
          { name: "Lec 5 · Sec 2: Default Privacy", url: "lec5-sec2.html" },
          { name: "Lec 6 · Sec 1: Access Enforcement", url: "lec6-sec1.html" },
          { name: "Lec 6 · Sec 2: Default Locked Vars", url: "lec6-sec2.html" },
          { name: "Lec 6 · Sec 3: Exposure State Corruption", url: "lec6-sec3.html" },
          { name: "Lec 7 · Sec 1: Inline Class Declarations", url: "lec7-sec1.html" },
          { name: "Lec 7 · Sec 2: Scope Resolution Bridge", url: "lec7-sec2.html" },
          { name: "Lec 7 · Sec 3: Inline Code Injections", url: "lec7-sec3.html" }
        ];

        scenes.forEach(s => {
          const card = document.createElement('a');
          card.className = 'scene-card';
          card.href = s.url;
          card.innerText = s.name;
          if (s.fullWidth) {
            card.style.gridColumn = '1 / -1';
            card.style.textAlign = 'center';
            card.style.fontWeight = 'bold';
            card.style.borderColor = 'var(--color-programming)';
          }
          grid.appendChild(card);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
