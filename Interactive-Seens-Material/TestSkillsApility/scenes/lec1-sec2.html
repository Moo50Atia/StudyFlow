<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lec 1 Sec 2 — Shared Global Scope</title>
  
  <!-- CDNs: Three.js, OrbitControls, KaTeX, Inter Font -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design Tokens & Glassmorphism Styles -->
  <style>
    :root {
      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-body: 16px;
      --font-size-caption: 14px;
      --font-size-heading: 24px;
      --font-size-title: 32px;
      --line-height-body: 1.6;
      --line-height-heading: 1.2;

      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Border Radius */
      --radius-button: 14px;
      --radius-card: 20px;
      --radius-dialog: 24px;
      --radius-badge: 999px;

      /* Glassmorphism Design System (VisionOS Style) */
      --glass-bg: rgba(15, 18, 30, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: 24px;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);

      /* Semantic Colors */
      --color-learning: #3b82f6;     /* Blue */
      --color-success: #22c55e;      /* Green */
      --color-attention: #f59e0b;    /* Orange */
      --color-creative: #a855f7;     /* Purple */
      --color-danger: #ef4444;       /* Red */
      --color-focus: #eab308;        /* Yellow */
      --color-programming: #06b6d4;  /* Cyan */

      /* Z-Index Layers */
      --z-canvas: 0;
      --z-interactive: 5;
      --z-panel: 10;
      --z-dialog: 20;
      --z-alert: 30;
      --z-tooltip: 40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: #f1f5f9;
      background-color: #020617;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-canvas);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    header.glass-panel {
      position: fixed;
      top: var(--space-md);
      left: var(--space-md);
      right: var(--space-md);
      height: 70px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
    }

    .header-title-section {
      display: flex;
      flex-direction: column;
    }

    .header-breadcrumb {
      font-size: var(--font-size-caption);
      color: #94a3b8;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .tab-bar.glass-panel {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      z-index: var(--z-panel);
      display: flex;
      align-items: center;
      padding: 0 var(--space-xs);
      border-radius: var(--radius-button);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: var(--space-sm) var(--space-lg);
      border-radius: calc(var(--radius-button) - 4px);
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 250ms ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid var(--layer-color, var(--color-learning));
    }

    .details-panel.glass-panel {
      position: fixed;
      top: 100px;
      right: var(--space-md);
      bottom: 90px;
      width: 380px;
      z-index: var(--z-panel);
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow-y: auto;
      max-width: calc(100vw - var(--space-lg) * 2);
    }

    .details-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .details-content p {
      margin-bottom: var(--space-md);
    }

    .details-content code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      color: #e2e8f0;
    }

    .controls-panel.glass-panel {
      position: fixed;
      top: 100px;
      left: var(--space-md);
      width: 320px;
      z-index: var(--z-panel);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .controls-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: var(--space-xs);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .control-label {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .control-slider {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-badge);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-programming);
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .control-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .interactive-btn {
      background: var(--color-learning);
      border: none;
      color: white;
      padding: 10px 12px;
      border-radius: var(--radius-button);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 150ms ease;
      text-align: center;
    }

    .interactive-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--color-danger);
    }

    #nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: var(--z-dialog);
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nav-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content.glass-panel {
      width: 90%;
      max-width: 900px;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-xl);
      position: relative;
    }

    .drawer-close {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .scene-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-button);
      padding: var(--space-md);
      text-decoration: none;
      color: #cbd5e1;
      transition: all 200ms ease;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--color-programming);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      .details-panel.glass-panel, .controls-panel.glass-panel {
        position: static;
        width: 100%;
        margin-top: var(--space-md);
        bottom: auto;
        height: auto;
      }
      .tab-bar.glass-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: var(--space-md);
        display: flex;
        justify-content: space-around;
        height: auto;
        padding: var(--space-xs);
      }
      header.glass-panel {
        position: static;
        height: auto;
        padding: var(--space-md);
        flex-direction: column;
        gap: var(--space-sm);
      }
      #mobile-layout-wrap {
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        margin-top: 80px;
        position: relative;
        z-index: var(--z-panel);
      }
    }
  </style>
</head>
<body>
  
  <div id="canvas-container"></div>
  
  <div id="mobile-layout-wrap">
    
    <header class="glass-panel">
      <div class="header-title-section">
        <span class="header-breadcrumb">Lecture 1 · Section 2</span>
        <h1 class="header-title" id="scene-title">Shared Global Scope</h1>

      <div class="header-nav">
        <a class="nav-btn" href="lec1-sec1.html" id="prev-btn">← Prev</a>

  <div id="nav-drawer" role="dialog" aria-modal="true" aria-label="Interactive Navigation Grid">

      <button class="drawer-close" id="drawer-close-btn" aria-label="Close index hub">×</button>
      <h2 class="header-title" style="margin-bottom: var(--space-md); text-align: center;">All Visual Scenes</h2>
      <div class="drawer-grid" id="drawer-scenes-grid">
        <!-- Loaded dynamically -->
      </div>

  <script>
    // ----------------------------------------------------
    // BASE 3D CONTENT GENERATOR (ABSTRACT)
    // ----------------------------------------------------
    class BaseGenerator {
      constructor(scene) {
        this.scene = scene;
        this.meshes = [];
        this.materials = [];
        this.geometries = [];
        this.activeLayer = 0;
      }

      create() {}
      update(delta, speed) {}
      
      transitionLayer(tabIndex) {
        this.activeLayer = tabIndex;
      }

      handleInteraction(controlId, value) {}

      dispose() {
        this.meshes.forEach(mesh => this.scene.remove(mesh));
        this.geometries.forEach(geo => geo.dispose());
        this.materials.forEach(mat => mat.dispose());
        this.meshes = [];
        this.geometries = [];
        this.materials = [];
      }

      smoothTransitionColor(material, targetHex, duration = 600) {
        const startColor = material.color.clone();
        const targetColor = new THREE.Color(targetHex);
        const startTime = performance.now();

        const animate = () => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          material.color.lerpColors(startColor, targetColor, ease);
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }

      createTextTexture(text, bgColor = 'rgba(0,0,0,0)', textColor = '#ffffff', fontSize = 32) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bgColor !== 'rgba(0,0,0,0)') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.font = `bold ${fontSize}px 'Inter', sans-serif`;
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
      }
    }

    // ----------------------------------------------------
    // LEC 1 SEC 2 GENERATOR (SHARED GLOBAL SCOPE)
    // ----------------------------------------------------
    class GlobalScopeGenerator extends BaseGenerator {
      constructor(scene) {
        super(scene);
        this.time = 0;
        this.particles = [];
        this.balance = 100;
        this.glitchIntensity = 0;
      }

      create() {
        // 1. Central "Global Data" Sphere
        const centerGeo = new THREE.SphereGeometry(1.0, 32, 32);
        const centerMat = new THREE.MeshPhysicalMaterial({
          color: 0x3b82f6,
          metalness: 0.1,
          roughness: 0.2,
          clearcoat: 1.0,
          emissive: 0x1d4ed8,
          emissiveIntensity: 0.2
        });
        this.centerMesh = new THREE.Mesh(centerGeo, centerMat);
        this.centerMesh.position.set(0, 0, 0);
        this.scene.add(this.centerMesh);
        this.meshes.push(this.centerMesh);
        this.geometries.push(centerGeo);
        this.materials.push(centerMat);

        // Billboard text for balance count above central sphere
        this.billboardTex = this.createTextTexture("Balance: $100", 'rgba(15,18,30,0.85)', '#ffffff', 44);
        const textGeo = new THREE.PlaneGeometry(2.4, 0.6);
        this.textMat = new THREE.MeshBasicMaterial({
          map: this.billboardTex,
          transparent: true,
          side: THREE.DoubleSide
        });
        this.billboard = new THREE.Mesh(textGeo, this.textMat);
        this.billboard.position.set(0, 1.6, 0);
        this.scene.add(this.billboard);
        this.meshes.push(this.billboard);
        this.geometries.push(textGeo);
        this.materials.push(this.textMat);

        // 2. Surrounding Function Nodes (Withdraw, Deposit, Check Balance)
        const nodeGeo = new THREE.SphereGeometry(0.35, 16, 16);
        this.nodes = [
          { name: "Deposit", pos: new THREE.Vector3(-2.8, 1.2, 0), color: 0x22c55e },
          { name: "Withdraw", pos: new THREE.Vector3(2.8, 1.2, 0), color: 0xef4444 },
          { name: "CheckBalance", pos: new THREE.Vector3(0, -2.2, 0), color: 0xa855f7 }
        ];

        this.nodeMeshes = [];
        this.nodes.forEach((n, idx) => {
          const nodeMat = new THREE.MeshPhysicalMaterial({
            color: n.color,
            roughness: 0.3,
            metalness: 0.1
          });
          const m = new THREE.Mesh(nodeGeo, nodeMat);
          m.position.copy(n.pos);
          this.scene.add(m);
          this.meshes.push(m);
          this.materials.push(nodeMat);
          this.nodeMeshes.push(m);

          // Add connecting line to center
          const linePoints = [n.pos, new THREE.Vector3(0, 0, 0)];
          const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
          const lineMat = new THREE.LineBasicMaterial({
            color: 0x475569,
            transparent: true,
            opacity: 0.5
          });
          const line = new THREE.Line(lineGeo, lineMat);
          this.scene.add(line);
          this.meshes.push(line);
          this.geometries.push(lineGeo);
          this.materials.push(lineMat);

          // Add function text label
          const tagTex = this.createTextTexture(n.name, 'rgba(0,0,0,0)', '#94a3b8', 32);
          const tagGeo = new THREE.PlaneGeometry(1.6, 0.4);
          const tagMat = new THREE.MeshBasicMaterial({
            map: tagTex,
            transparent: true,
            side: THREE.DoubleSide
          });
          const tagMesh = new THREE.Mesh(tagGeo, tagMat);
          tagMesh.position.copy(n.pos).add(new THREE.Vector3(0, 0.55, 0));
          this.scene.add(tagMesh);
          this.meshes.push(tagMesh);
          this.geometries.push(tagGeo);
          this.materials.push(tagMat);
        });
        this.geometries.push(nodeGeo);

        // Core RAM Address mapping visual
        const addressTex = this.createTextTexture(" balance @ 0x004B2004", 'rgba(15,18,30,0.85)', '#06b6d4', 32);
        const addressGeo = new THREE.PlaneGeometry(2.4, 0.5);
        this.addressMat = new THREE.MeshBasicMaterial({
          map: addressTex,
          transparent: true
        });
        this.addressBillboard = new THREE.Mesh(addressGeo, this.addressMat);
        this.addressBillboard.position.set(0, -1.5, 0);
        this.addressBillboard.visible = false;
        this.scene.add(this.addressBillboard);
        this.meshes.push(this.addressBillboard);
        this.geometries.push(addressGeo);
        this.materials.push(this.addressMat);
      }

      update(delta, speed) {
        this.time += delta * speed;

        // Floating animation for nodes
        this.nodeMeshes.forEach((mesh, idx) => {
          mesh.position.y = this.nodes[idx].pos.y + Math.sin(this.time * 1.5 + idx) * 0.08;
        });

        // Rotate central sphere
        this.centerMesh.rotation.y += delta * 0.4;
        this.centerMesh.rotation.x += delta * 0.2;

        // Glitch scaling of center sphere to represent corruption
        if (this.glitchIntensity > 0) {
          const glitchScale = 1.0 + Math.sin(this.time * 30) * 0.08 * this.glitchIntensity;
          this.centerMesh.scale.set(glitchScale, glitchScale, glitchScale);
          this.glitchIntensity -= delta * 0.4;
        } else {
          this.centerMesh.scale.set(1, 1, 1);
        }

        // Update active flying particle signals
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.age += delta * speed;
          const t = Math.min(p.age / p.lifetime, 1);
          p.mesh.position.lerpVectors(p.start, p.end, t);

          if (t >= 1) {
            this.scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            this.particles.splice(i, 1);

            // Execute balance value update
            this.balance += p.valueChange;
            this.updateBalanceUI();
            this.triggerPulse();
          }
        }
      }

      updateBalanceUI() {
        const billboardCanvas = this.billboard.material.map.image;
        const ctx = billboardCanvas.getContext('2d');
        ctx.clearRect(0, 0, billboardCanvas.width, billboardCanvas.height);
        
        ctx.fillStyle = 'rgba(15,18,30,0.85)';
        ctx.fillRect(0, 0, billboardCanvas.width, billboardCanvas.height);

        ctx.font = `bold 44px 'Inter', sans-serif`;
        // if balance is glitched (due to race condition) display warning color
        if (this.balance !== 100 && this.balance !== 110 && this.balance !== 90 && this.balance !== 120 && this.balance !== 80) {
          ctx.fillStyle = '#ef4444';
          ctx.fillText(`Balance: $${this.balance} !`, billboardCanvas.width / 2, billboardCanvas.height / 2);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`Balance: $${this.balance}`, billboardCanvas.width / 2, billboardCanvas.height / 2);
        }

        this.billboard.material.map.needsUpdate = true;
      }

      triggerPulse() {
        const startColor = this.centerMesh.material.color.clone();
        this.centerMesh.material.color.setHex(0x22c55e);
        setTimeout(() => {
          this.centerMesh.material.color.copy(startColor);
        }, 150);
      }

      spawnSignalParticles(nodeIdx, count, valueChange) {
        const nodePos = this.nodeMeshes[nodeIdx].position;
        for (let i = 0; i < count; i++) {
          const pGeo = new THREE.SphereGeometry(0.08, 8, 8);
          const pMat = new THREE.MeshBasicMaterial({
            color: this.nodes[nodeIdx].color,
            transparent: true,
            opacity: 0.9
          });
          const pMesh = new THREE.Mesh(pGeo, pMat);
          pMesh.position.copy(nodePos);
          
          // randomize position offset slightly
          pMesh.position.x += (Math.random() - 0.5) * 0.2;
          pMesh.position.y += (Math.random() - 0.5) * 0.2;

          this.scene.add(pMesh);

          this.particles.push({
            mesh: pMesh,
            start: pMesh.position.clone(),
            end: new THREE.Vector3(0, 0, 0),
            age: 0,
            lifetime: 0.6 + Math.random() * 0.4,
            valueChange: valueChange / count
          });
        }
      }

      transitionLayer(tabIndex) {
        super.transitionLayer(tabIndex);
        const centerMat = this.centerMesh.material;
        
        // reset visibility
        this.addressBillboard.visible = false;

        switch (tabIndex) {
          case 0: // Software (Solid Blue)
            centerMat.wireframe = false;
            this.smoothTransitionColor(centerMat, '#3b82f6');
            centerMat.opacity = 1.0;
            break;

          case 1: // RAM Map
            centerMat.wireframe = true;
            this.smoothTransitionColor(centerMat, '#a855f7');
            this.addressBillboard.visible = true;
            break;

          case 2: // CPU / RIP (Cyan)
            centerMat.wireframe = false;
            this.smoothTransitionColor(centerMat, '#06b6d4');
            break;

          case 3: // GPU FX
            centerMat.wireframe = true;
            this.smoothTransitionColor(centerMat, '#22c55e');
            break;

          case 4: // Corrector (Alert Red)
            centerMat.wireframe = false;
            this.smoothTransitionColor(centerMat, '#ef4444');
            break;
        }
      }

      handleInteraction(controlId, value) {
        if (controlId === 'deposit') {
          this.spawnSignalParticles(0, 5, 10);
        } else if (controlId === 'withdraw') {
          this.spawnSignalParticles(1, 5, -10);
        } else if (controlId === 'race') {
          // Spawn both concurrently, but introduce calculation error
          this.spawnSignalParticles(0, 5, 10);
          this.spawnSignalParticles(1, 5, -15); // should sum to -5, but race causes balance mismatch
          this.glitchIntensity = 1.0;
        }
      }
    }

    // ----------------------------------------------------
    // THREE.JS SCENE MANAGEMENT LAYER
    // ----------------------------------------------------
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x020617);
        this.scene.fog = new THREE.FogExp2(0x020617, 0.015);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.1;
        this.container.appendChild(this.renderer.domElement);

        this.camera = new THREE.PerspectiveCamera(
          45,
          this.container.clientWidth / this.container.clientHeight,
          0.1,
          100
        );
        this.camera.position.set(0, 0.5, 7.5);

        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 + 0.1;
        this.controls.minDistance = 2;
        this.controls.maxDistance = 25;

        this.lights = new LightingManager(this.scene);
        this.generator = new GlobalScopeGenerator(this.scene);

        this.clock = new THREE.Clock();
        this.animationFrameId = null;

        this.onResize = this.onResize.bind(this);
        window.addEventListener('resize', this.onResize);
      }

      init() {
        this.lights.createStandardRig();
        this.generator.create();
        this.animate();
      }

      onResize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(() => this.animate());
        const delta = this.clock.getDelta();
        
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reducedMotion) {
          this.generator.update(delta, window.app.speedMultiplier);
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }

      dispose() {
        cancelAnimationFrame(this.animationFrameId);
        window.removeEventListener('resize', this.onResize);
        this.generator.dispose();
        this.lights.dispose();
        this.controls.dispose();
        this.renderer.dispose();
        this.renderer.domElement.remove();
      }
    }

    class LightingManager {
      constructor(scene) {
        this.scene = scene;
        this.lights = [];
      }

      createStandardRig() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambient);
        this.lights.push(ambient);

        const key = new THREE.DirectionalLight(0xffffff, 0.85);
        key.position.set(5, 8, 5);
        this.scene.add(key);
        this.lights.push(key);

        const fill = new THREE.DirectionalLight(0x06b6d4, 0.35);
        fill.position.set(-5, 4, -5);
        this.scene.add(fill);
        this.lights.push(fill);

        const rim = new THREE.PointLight(0xa855f7, 0.8, 12);
        rim.position.set(0, 4, -3);
        this.scene.add(rim);
        this.lights.push(rim);
      }

      dispose() {
        this.lights.forEach(light => this.scene.remove(light));
        this.lights = [];
      }
    }

    // ----------------------------------------------------
    // APPLICATION & INTERACTION CONTROLLER
    // ----------------------------------------------------
    class ApplicationManager {
      constructor() {
        this.speedMultiplier = 1.0;
        this.sceneConfig = {
          id: "lec1-sec2",
          title: "Shared Global Scope",
          layers: [
            {
              name: "THE SOFTWARE LAYER",
              content: `
                <p>In procedural architectures, data often lives globally in a shared scope. A central 3D glowing sphere represents the shared global variable <code>balance</code>, physically wired to independent functions (Withdraw, Deposit).</p>
                <p>When deposit or withdraw modules execute, they write directly to this single data structure, showing particle packets traveling from functions to the core variable.</p>
              `
            },
            {
              name: "THE MEMORY TOPOLOGY (RAM) LAYER",
              content: `
                <p>Global variables are allocated in the dedicated <strong>Data segment (.data/.bss)</strong> at compile time, retaining a fixed, shared RAM address throughout execution:</p>
                <code>Address: 0x004B2004</code>
                <p><em>RAM Map Principle:</em> Individual thread stacks hold small isolated execution call-return pointers, but contain no local copy of <code>balance</code>. They all dereference the same shared address cell.</p>
              `
            },
            {
              name: "THE CPU & REGISTERS LAYER",
              content: `
                <p>Threads run concurrently on separate CPU cores, moving independently. Core A loads the value into register <code>RAX</code>, while Core B loads it into register <code>RBX</code>.</p>
                <p>Without hardware synchronization (e.g. <code>lock</code> instruction prefix), the steps interleave, causing a race condition update:</p>
                $$\\text{Lost Update} = \\Delta RAX - \\Delta RBX$$
              `
            },
            {
              name: "THE GPU / VRAM LAYER",
              content: `
                <p>The central data node is drawn in VRAM. Particle vectors (representing read/write signals) stream along coordinates between the logic nodes and center node.</p>
                <p>Changing signal rate increases vertex streaming parameters inside the GPU's memory buffer updates.</p>
              `
            },
            {
              name: "UNDER-THE-HOOD CORRECTOR",
              content: `
                <div style="border-left: 4px solid var(--color-danger); padding-left: 10px; background: rgba(239, 68, 68, 0.08); padding-top: 8px; padding-bottom: 8px; border-radius: 4px;">
                  <strong style="color:var(--color-danger)">Misconception Shattered:</strong>
                  <p>Global data is not "magically protected" by the compiler. It resides in a fixed segment accessible by all CPU cores. Without thread-safe hardware synchronization (like lock prefixes, atomic instructions, or memory barriers), concurrent access causes race conditions and cache line thrashing.</p>
                </div>
              `
            }
          ]
        };
      }

      init() {
        const canvasContainer = document.getElementById('canvas-container');
        this.sceneManager = new SceneManager(canvasContainer);
        this.sceneManager.init();

        this.initEventListeners();
        this.initDrawerGrid();
        this.switchTab(0);
        
        window.addEventListener('beforeunload', () => {
          this.sceneManager.dispose();
        });
      }

      initEventListeners() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const tabIdx = parseInt(btn.dataset.tab);
            this.switchTab(tabIdx);
          });
        });

        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        if (slider) {
          slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            this.speedMultiplier = val;
            speedVal.innerText = val.toFixed(1) + 'x';
          });
        }

        document.getElementById('withdraw-btn').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('deposit');
        });

        document.getElementById('deposit-btn').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('withdraw');
        });

        document.getElementById('race-btn').addEventListener('click', () => {
          this.sceneManager.generator.handleInteraction('race');
        });

        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('nav-drawer');
        const drawerClose = document.getElementById('drawer-close-btn');

        if (menuBtn && drawer) {
          menuBtn.addEventListener('click', () => drawer.classList.add('open'));
        }
        if (drawerClose && drawer) {
          drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
        }

        window.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '5') {
            const tabIdx = parseInt(e.key) - 1;
            const btn = document.querySelector(`.tab-btn[data-tab="${tabIdx}"]`);
            if (btn) btn.click();
          }
        });
      }

      switchTab(tabIdx) {
        const layer = this.sceneConfig.layers[tabIdx];
        document.getElementById('panel-layer-name').innerText = layer.name;
        
        const contentContainer = document.getElementById('panel-dynamic-content');
        contentContainer.innerHTML = layer.content;

        if (window.renderMathInElement) {
          renderMathInElement(contentContainer, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }

        this.sceneManager.generator.transitionLayer(tabIdx);
      }

      initDrawerGrid() {
        const grid = document.getElementById('drawer-scenes-grid');
        const items = [
          { name: "Procedural Execution Flow", path: "lec1-sec1.html", lec: "Lec 1 · Sec 1" },
          { name: "Shared Global Scope", path: "lec1-sec2.html", lec: "Lec 1 · Sec 2" },
          { name: "Decentralized Object Networks", path: "lec2-sec1.html", lec: "Lec 2 · Sec 1" },
          { name: "Object Identity & State", path: "lec2-sec2.html", lec: "Lec 2 · Sec 2" },
          { name: "Encapsulation Barriers", path: "lec2-sec3.html", lec: "Lec 2 · Sec 3" },
          { name: "State & Representation", path: "lec3-sec1.html", lec: "Lec 3 · Sec 1" },
          { name: "Object Behavior & Methods", path: "lec3-sec2.html", lec: "Lec 3 · Sec 2" },
          { name: "Class Blueprint vs. Instances", path: "lec3-sec3.html", lec: "Lec 3 · Sec 3" }
        ];

        grid.innerHTML = items.map(item => `
          <a class="scene-card" href="${item.path}">
            <div style="font-size: 12px; color: #94a3b8;">${item.lec}</div>
            <div style="font-weight: 600; color: #fff;">${item.name}</div>
          </a>
        `).join('');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new ApplicationManager();
      window.app.init();
    });
  </script>
